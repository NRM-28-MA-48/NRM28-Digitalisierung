  <script type="text/babel">

    // Eingebettetes, transparentes 48er-Vektor-Logo als sofortiger Fallback,

    // --- INITIALE BEISPIELDATEN ---
    const INITIAL_DATA = {

      members: [
        { id: "m1", name: "Ludwig T.", role: "Chefredaktion & Koordination", phone: "+436641234567", color: "bg-orange-600" },

          ],

            { id: "w2", step: 2, title: "Recherche-Daten & Zahlen einfügen (wartet auf Schritt 1)", memberId: "m2", done: false, completedAt: null },
            { id: "w3", step: 3, title: "Text ausformulieren & Lektorat (wartet auf Schritt 2)", memberId: "m3", done: false, completedAt: null },
            { id: "w4", step: 4, title: "Finales Satz-Layout & PDF-Freigabe (wartet auf Schritt 3)", memberId: "m4", done: false, completedAt: null }
          ],
          files: [],
          content: "# Hauptbeitrag: Projektanalyse\n\n## 1. Einleitung (Ludwig T.)\nDie Grundstruktur steht bereits. Hier wird der Aufhänger unseres Beitrags beschrieben...\n\n## 2. Hintergrund & Zahlen (Helena S.)\n[Hier bitte die recherchierten Daten eintragen oder als Datei anhängen]\n\n## 3. Fazit & Ausblick (Marie D.)\n[Folgt nach der Datenauswertung]",
          notes: [

          responsibilities: [

          ],
          workflow: [
            { id: "w2_1", step: 1, title: "Quellenliste zusammentragen", memberId: "m1", done: true, completedAt: "24.10.2026" },
            { id: "w2_2", step: 2, title: "Zitierweise & Bildrechte finalisieren", memberId: "m3", done: true, completedAt: "26.10.2026" }
          ],
          files: [],
          content: "# Quellen- & Bildverzeichnis\n\n- Interne Erhebung (2026)\n- Fotodokumentation Redaktionsteam\n",
          notes: []
        }
      ]
    };

    function App() {
      const [logoSrc, setLogoSrc] = useState(FALLBACK_48ER_SVG);

      // Lädt "48er.png" und entfernt automatisch den weißen Hintergrund (macht ihn 100% transparent)
      useEffect(() => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          try {
            const canvas = document.createElement("canvas");
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = imgData.data;

            // Weiße und fast weiße Pixel transparent schalten (weicher Übergang an den Kanten)
            for (let i = 0; i < d.length; i += 4) {
              const r = d[i], g = d[i + 1], b = d[i + 2];
              if (r > 240 && g > 240 && b > 240) {
                d[i + 3] = 0; // Komplett transparent
              } else if (r > 215 && g > 215 && b > 215 && Math.abs(r - g) < 15 && Math.abs(r - b) < 15) {
                // Sanftes Anti-Aliasing an den Rändern
                const brightness = (r + g + b) / 3;
                d[i + 3] = Math.max(0, Math.min(255, Math.round((240 - brightness) * 10)));
              }
            }
            ctx.putImageData(imgData, 0, 0);
            const transparentDataUrl = canvas.toDataURL("image/png");
            setLogoSrc(transparentDataUrl);

            // Auch als Browser-Favicon und Smartphone-Icon setzen
            const fav = document.getElementById("app-favicon");
            const touch = document.getElementById("app-touch-icon");
            if (fav) fav.href = transparentDataUrl;
            if (touch) touch.href = transparentDataUrl;
          } catch (e) {
            // Falls Browser lokale Canvas-Bearbeitung blockiert, Bild direkt verwenden
            setLogoSrc("48er.png");
          }
        };
        img.src = "48er.png";
      }, []);

      const [data, setData] = useState(() => {
        // Einmalige Übernahme der MA48-Daten möglich; danach eigene, getrennte V3-Daten.
        const saved = localStorage.getItem("nrm_data_v3") || localStorage.getItem("nrm_data_v1") || localStorage.getItem("groupsync_data_v2");
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            parsed.documents = (parsed.documents || []).map(d => ({ ...d, files: d.files || [] }));
            return parsed;
          } catch (e) {
            return INITIAL_DATA;
          }
        }
        return INITIAL_DATA;
      });

      const [activeTab, setActiveTab] = useState("dashboard");
      const [selectedMemberId, setSelectedMemberId] = useState(() => localStorage.getItem("nrm_selected_member_v3") || "");
      const [onlyMyDocuments, setOnlyMyDocuments] = useState(false);
      useEffect(() => { localStorage.setItem("nrm_selected_member_v3", selectedMemberId); }, [selectedMemberId]);
      const [selectedCategory, setSelectedCategory] = useState("Alle");
      const [selectedDocId, setSelectedDocId] = useState(data.documents[0]?.id || null);
      const [docViewMode, setDocViewMode] = useState("split");
      const [notificationModal, setNotificationModal] = useState(null);

      // Formular-States (Neu anlegen)
      const [newDocModal, setNewDocModal] = useState(false);
      const [newDocForm, setNewDocForm] = useState({ title: "", category: "Allgemein", deadline: "", description: "" });
      const [newStepForm, setNewStepForm] = useState({ title: "", memberId: "" });
      const [newRespForm, setNewRespForm] = useState({ task: "", memberId: "" });
      const [newNoteText, setNewNoteText] = useState("");
      const [newMeetingForm, setNewMeetingForm] = useState({ title: "", date: "", time: "", location: "", type: "Treffen" });
      const [newMemberForm, setNewMemberForm] = useState({ name: "", role: "", phone: "" });
      const [newCategoryName, setNewCategoryName] = useState("");

      // Datei-Upload States
      const [uploadMemberId, setUploadMemberId] = useState("");
      const [uploadComment, setUploadComment] = useState("");
      const [externalLinkForm, setExternalLinkForm] = useState({ name: "", url: "", memberId: "" });
      const [showLinkForm, setShowLinkForm] = useState(false);

      // Bearbeiten-States
      const [editingMember, setEditingMember] = useState(null);
      const [editingMeeting, setEditingMeeting] = useState(null);
      const [editingDocMeta, setEditingDocMeta] = useState(null);
      const [editingStep, setEditingStep] = useState(null);

      useEffect(() => {
        try {
          localStorage.setItem("nrm_data_v3", JSON.stringify(data));
        } catch (err) {
          alert("Hinweis: Der lokale Browser-Speicher ist fast voll (durch große Datei-Anhänge). Bitte nutze oben rechts 'Stand speichern', um alle Daten als Datei zu sichern.");
        }
      }, [data]);

      const activeDoc = data.documents.find(d => d.id === selectedDocId) || data.documents[0];

      const getMember = (id) => data.members.find(m => m.id === id) || { name: "Redaktionsmitglied", phone: "", color: "bg-orange-500", role: "" };

      const getProgress = (doc) => {
        if (!doc || !doc.workflow || doc.workflow.length === 0) return 0;
        const doneCount = doc.workflow.filter(w => w.done).length;
        return Math.round((doneCount / doc.workflow.length) * 100);
      };

      const getDaysLeft = (dateStr) => {
        if (!dateStr) return null;
        const diff = new Date(dateStr) - new Date();
        return Math.ceil(diff / (1000 * 60 * 60 * 24));
      };

      const formatFileSize = (bytes) => {
        if (!bytes) return "";
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / 1048576).toFixed(2) + " MB";
      };

      // WhatsApp & SMS Links
      const sendWhatsApp = (phone, message) => {
        const cleanPhone = (phone || "").replace(/[^0-9+]/g, "").replace(/^\+/, "");
        const url = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;
        window.open(url, "_blank");
      };

      const sendSMS = (phone, message) => {
        const cleanPhone = (phone || "").replace(/[^0-9+,]/g, "");
        const url = `sms:${cleanPhone}?body=${encodeURIComponent(message)}`;
        window.location.href = url;
      };

      // --- KALENDEREXPORT ALS .ICS (kein Server und keine SMS-Kosten nötig) ---
      const calendarEscape = (value) => String(value || "")
        .replace(/\\/g, "\\\\").replace(/\r?\n/g, "\\n")
        .replace(/,/g, "\\,").replace(/;/g, "\\;");

      const calendarDate = (value) => String(value || "").replace(/-/g, "");

      const buildCalendarEvents = () => [
        ...data.meetings.map(m => ({
          id: "meeting_" + m.id, date: m.date, time: m.time,
          title: `${m.type === "Abgabe" ? "ABGABE" : "TREFFEN"}: ${m.title}`,
          description: `NRM28 / MA48 – ${m.type}. Erinnerung aus dem Gruppenplaner.`,
          location: m.location, isDeadline: m.type === "Abgabe"
        })),
        ...data.documents.filter(d => d.deadline).map(d => ({
          id: "document_" + d.id, date: d.deadline, time: "",
          title: `ABGABE Dokument: ${d.title}`,
          description: `NRM28 / MA48 – Dokumentenabgabe. ${d.description || ""}`,
          location: "", isDeadline: true
        }))
      ];

      const downloadCalendar = (events, fileName = "NRM28-Kalender.ics") => {
        const valid = events.filter(ev => /^\d{4}-\d{2}-\d{2}$/.test(ev.date || ""));
        if (!valid.length) { alert("Keine Termine mit gültigem Datum vorhanden."); return; }
        const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
        const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//NRM28 MA48//Group Planner V3//DE", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:NRM28 MA48"];
        valid.forEach(ev => {
          lines.push("BEGIN:VEVENT", `UID:${String(ev.id).replace(/[^a-zA-Z0-9_-]/g, "_")}@nrm28`, `DTSTAMP:${stamp}`,
            `SUMMARY:${calendarEscape(ev.title)}`, `DESCRIPTION:${calendarEscape(ev.description)}`);
          if (ev.location) lines.push(`LOCATION:${calendarEscape(ev.location)}`);
          if (/^\d{2}:\d{2}$/.test(ev.time || "")) {
            lines.push(`DTSTART;TZID=Europe/Vienna:${calendarDate(ev.date)}T${ev.time.replace(":", "")}00`);
            lines.push(`DURATION:${ev.isDeadline ? "PT1M" : "PT1H"}`);
          } else {
            lines.push(`DTSTART;VALUE=DATE:${calendarDate(ev.date)}`, "DURATION:P1D");
          }
          lines.push("BEGIN:VALARM", `TRIGGER:${ev.isDeadline ? "-P1D" : "-PT1H"}`, "ACTION:DISPLAY",
            `DESCRIPTION:${calendarEscape("Erinnerung: " + ev.title)}`, "END:VALARM", "END:VEVENT");
        });
        lines.push("END:VCALENDAR");
        const blob = new Blob([lines.join("\r\n") + "\r\n"], { type: "text/calendar;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url; link.download = fileName; document.body.appendChild(link);
        link.click(); link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      };

      const openDocument = (docId) => {
        setSelectedDocId(docId);
        setSelectedCategory("Alle");
        setOnlyMyDocuments(false);
        setActiveTab("documents");
      };

      // --- DATEI HOCHLADEN & HERUNTERLADEN ---
      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file || !activeDoc) return;

        if (file.size > 4 * 1024 * 1024) {
          if (!confirm("Diese Datei ist größer als 4 MB. Für sehr große Dateien empfiehlt sich ein Cloud-Link oder der direkte JSON-Export ('Stand speichern'). Trotzdem einbetten?")) {
            e.target.value = "";
            return;
          }
        }

        const reader = new FileReader();
        reader.onload = (ev) => {
          const uploader = (uploadMemberId || selectedMemberId) ? getMember(uploadMemberId || selectedMemberId).name : "Redaktion";
          const newFileEntry = {
            id: "f_" + Date.now(),
            name: file.name,
            size: file.size,
            type: file.type,
            dataUrl: ev.target.result,
            uploadedBy: uploader,
            comment: uploadComment || "Zur weiteren Bearbeitung",
            uploadedAt: new Date().toLocaleString("de-DE"),
            isExternal: false
          };

          setData(prev => ({
            ...prev,
            documents: prev.documents.map(d =>
              d.id === activeDoc.id ? { ...d, files: [newFileEntry, ...(d.files || [])] } : d
            )
          }));
          setUploadComment("");
          e.target.value = "";
        };
        reader.readAsDataURL(file);
      };

      const handleAddExternalLink = (e) => {
        e.preventDefault();
        if (!externalLinkForm.name || !externalLinkForm.url || !activeDoc) return;
        const uploader = (externalLinkForm.memberId || selectedMemberId) ? getMember(externalLinkForm.memberId || selectedMemberId).name : "Redaktion";
        const newLinkEntry = {
          id: "f_" + Date.now(),
          name: externalLinkForm.name,
          size: 0,
          type: "link",
          dataUrl: externalLinkForm.url,
          uploadedBy: uploader,
          comment: "Externer Cloud-Link",
          uploadedAt: new Date().toLocaleString("de-DE"),
          isExternal: true
        };

        setData(prev => ({
          ...prev,
          documents: prev.documents.map(d =>
            d.id === activeDoc.id ? { ...d, files: [newLinkEntry, ...(d.files || [])] } : d
          )
        }));
        setExternalLinkForm({ name: "", url: "", memberId: "" });
        setShowLinkForm(false);
      };

      const deleteFile = (fileId) => {
        if (!confirm("Diesen Datei-Anhang wirklich entfernen?")) return;
        setData(prev => ({
          ...prev,
          documents: prev.documents.map(d =>
            d.id === activeDoc.id ? { ...d, files: (d.files || []).filter(f => f.id !== fileId) } : d
          )
        }));
      };

      // --- BEARBEITEN-FUNKTIONEN ---
      const saveEditedMember = (e) => {
        e.preventDefault();
        if (!editingMember || !editingMember.name) return;
        setData(prev => ({
          ...prev,
          members: prev.members.map(m => m.id === editingMember.id ? editingMember : m)
        }));
        setEditingMember(null);
      };

      const saveEditedMeeting = (e) => {
        e.preventDefault();
        if (!editingMeeting || !editingMeeting.title) return;
        setData(prev => ({
          ...prev,
          meetings: prev.meetings.map(m => m.id === editingMeeting.id ? editingMeeting : m)
        }));
        setEditingMeeting(null);
      };

      const saveEditedDocMeta = (e) => {
        e.preventDefault();
        if (!editingDocMeta || !editingDocMeta.title) return;
        setData(prev => ({
          ...prev,
          documents: prev.documents.map(d =>
            d.id === editingDocMeta.id
              ? { ...d, title: editingDocMeta.title, category: editingDocMeta.category, deadline: editingDocMeta.deadline, description: editingDocMeta.description }
              : d
          )
        }));
        setEditingDocMeta(null);
      };

      const saveEditedStep = (e) => {
        e.preventDefault();
        if (!editingStep || !editingStep.title) return;
        setData(prev => ({
          ...prev,
          documents: prev.documents.map(d => {
            if (d.id !== activeDoc.id) return d;
            return {
              ...d,
              workflow: d.workflow.map(w => w.id === editingStep.id ? { ...w, title: editingStep.title, memberId: editingStep.memberId } : w)
            };
          })
        }));
        setEditingStep(null);
      };

      // --- LÖSCH-FUNKTIONEN ---
      const deleteMember = (memberId, memberName) => {
        if (!confirm(`Möchtest du "${memberName}" wirklich aus den Kontakten löschen?`)) return;
        setData(prev => ({
          ...prev,
          members: prev.members.filter(m => m.id !== memberId),
          documents: prev.documents.map(doc => ({
            ...doc,
            responsibilities: doc.responsibilities.filter(r => r.memberId !== memberId),
            workflow: doc.workflow.filter(w => w.memberId !== memberId)
          }))
        }));
      };

      const deleteDocument = (docId, docTitle) => {
        if (!confirm(`Dokument "${docTitle}" wirklich unwiderruflich löschen?`)) return;
        setData(prev => {
          const remaining = prev.documents.filter(d => d.id !== docId);
          if (selectedDocId === docId) {
            setSelectedDocId(remaining[0]?.id || null);
          }
          return { ...prev, documents: remaining };
        });
      };

      const deleteWorkflowStep = (stepId) => {
        setData(prev => ({
          ...prev,
          documents: prev.documents.map(d => {
            if (d.id !== activeDoc.id) return d;
            return { ...d, workflow: d.workflow.filter(w => w.id !== stepId) };
          })
        }));
      };

      const deleteResponsibility = (index) => {
        setData(prev => ({
          ...prev,
          documents: prev.documents.map(d => {
            if (d.id !== activeDoc.id) return d;
            return { ...d, responsibilities: d.responsibilities.filter((_, i) => i !== index) };
          })
        }));
      };

      const deleteMeeting = (meetingId) => {
        if (!confirm("Diesen Termin wirklich löschen?")) return;
        setData(prev => ({
          ...prev,
          meetings: prev.meetings.filter(m => m.id !== meetingId)
        }));
      };

      // Abhängigkeits-Schritt umschalten
      const toggleWorkflowStep = (docId, stepIndex) => {
        setData(prev => {
          const docs = prev.documents.map(doc => {
            if (doc.id !== docId) return doc;
            const newWorkflow = [...doc.workflow];
            const currentStep = newWorkflow[stepIndex];

            if (stepIndex > 0 && !newWorkflow[stepIndex - 1].done && !currentStep.done) {
              alert(`Abhängigkeit beachten: Schritt ${stepIndex} (${getMember(newWorkflow[stepIndex - 1].memberId).name}) muss zuerst abgeschlossen werden!`);
              return doc;
            }

            const nowDone = !currentStep.done;
            newWorkflow[stepIndex] = {
              ...currentStep,
              done: nowDone,
              completedAt: nowDone ? new Date().toLocaleDateString("de-DE") : null
            };

            if (nowDone && stepIndex + 1 < newWorkflow.length) {
              const nextStep = newWorkflow[stepIndex + 1];
              const personA = getMember(currentStep.memberId);
              const personB = getMember(nextStep.memberId);
              setNotificationModal({
                title: "Vorarbeit erledigt! Nächste Person benachrichtigen?",
                recipient: personB,
                message: `Hallo ${personB.name}! 👋\n${personA.name} hat gerade den Schritt "${currentStep.title}" im Beitrag "${doc.title}" (NRM) fertiggestellt.\n\nDu kannst jetzt die aktuelle Datei herunterladen und mit deinem Teil starten: "${nextStep.title}".\nAbgabetermin ist der ${doc.deadline}.`
              });
            }

            return { ...doc, workflow: newWorkflow };
          });
          return { ...prev, documents: docs };
        });
      };

      const updateDocContent = (content) => {
        setData(prev => ({
          ...prev,
          documents: prev.documents.map(d => d.id === activeDoc.id ? { ...d, content } : d)
        }));
      };

      const addWorkflowStep = (e) => {
        e.preventDefault();
        if (!newStepForm.title || !newStepForm.memberId) return;
        setData(prev => ({
          ...prev,
          documents: prev.documents.map(d => {
            if (d.id !== activeDoc.id) return d;
            const nextStepNum = d.workflow.length + 1;
            return {
              ...d,
              workflow: [...d.workflow, {
                id: "w_" + Date.now(),
                step: nextStepNum,
                title: newStepForm.title,
                memberId: newStepForm.memberId,
                done: false,
                completedAt: null
              }]
            };
          })
        }));
        setNewStepForm({ title: "", memberId: "" });
      };

      const addResponsibility = (e) => {
        e.preventDefault();
        if (!newRespForm.task || !newRespForm.memberId) return;
        setData(prev => ({
          ...prev,
          documents: prev.documents.map(d => {
            if (d.id !== activeDoc.id) return d;
            return {
              ...d,
              responsibilities: [...d.responsibilities, { memberId: newRespForm.memberId, task: newRespForm.task }]
            };
          })
        }));
        setNewRespForm({ task: "", memberId: "" });
      };

      const addNote = (e) => {
        e.preventDefault();
        if (!newNoteText.trim()) return;
        setData(prev => ({
          ...prev,
          documents: prev.documents.map(d => {
            if (d.id !== activeDoc.id) return d;
            return {
              ...d,
              notes: [{ id: "n_" + Date.now(), author: selectedMemberId ? getMember(selectedMemberId).name : "Redaktion", text: newNoteText, time: new Date().toLocaleString("de-DE") }, ...d.notes]
            };
          })
        }));
        setNewNoteText("");
      };

      const createNewDocument = (e) => {
        e.preventDefault();
        if (!newDocForm.title) return;
        const newDoc = {
          id: "d_" + Date.now(),
          title: newDocForm.title,
          category: newDocForm.category,
          deadline: newDocForm.deadline || "2026-12-01",
          description: newDocForm.description || "Gemeinsames Redaktionsdokument",
          responsibilities: [],
          workflow: [],
          files: [],
          content: `# ${newDocForm.title}\n\nHier gemeinsam schreiben oder rechts Dateien zur Weiterbearbeitung hochladen...`,
          notes: []
        };
        setData(prev => ({ ...prev, documents: [...prev.documents, newDoc] }));
        setSelectedDocId(newDoc.id);
        setNewDocModal(false);
        setNewDocForm({ title: "", category: "Allgemein", deadline: "", description: "" });
      };

      const exportData = () => {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `NRM-Projektstand-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
      };

      const importData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            imported.documents = (imported.documents || []).map(d => ({ ...d, files: d.files || [] }));
            setData(imported);
            alert("NRM-Projektstand inklusive aller Dateien erfolgreich geladen!");
          } catch (err) {
            alert("Ungültige Projekt-Datei.");
          }
        };
        reader.readAsText(file);
      };

      const selectedMember = data.members.find(m => m.id === selectedMemberId) || null;
      const allSteps = data.documents.flatMap(doc => (doc.workflow || []).map((step, index) => ({
        ...step, doc, index,
        blocked: index > 0 && !doc.workflow[index - 1].done && !step.done
      })));
      const mySteps = allSteps.filter(step => !selectedMemberId || step.memberId === selectedMemberId);
      const unfinishedSteps = mySteps.filter(step => !step.done);
      const personalDocumentIds = new Set(data.documents.filter(d =>
        (d.workflow || []).some(w => w.memberId === selectedMemberId) ||
        (d.responsibilities || []).some(r => r.memberId === selectedMemberId)
      ).map(d => d.id));
      const filteredDocs = data.documents.filter(d =>
        (selectedCategory === "Alle" || d.category === selectedCategory) &&
        (!onlyMyDocuments || !selectedMemberId || personalDocumentIds.has(d.id))
      );
      const nextEvents = buildCalendarEvents().filter(event => event.date)
        .sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")));
      const today = new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Vienna" });
      const upcomingEvents = nextEvents.filter(event => event.date >= today);
      const blockedCount = unfinishedSteps.filter(step => step.blocked).length;
      const completedSteps = allSteps.filter(step => step.done).length;

      return (
        <div className="min-h-screen flex flex-col bg-orange-50/30">
          {/* TOP NAVIGATION IN ORANGE */}
          <header className="bg-gradient-to-r from-orange-600 via-orange-500 to-amber-500 text-white shadow-md sticky top-0 z-30 border-b border-orange-700/20">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3.5">
                {/* 48er-Icon mit transparentem Hintergrund auf hellem Badge für optimalen Kontrast */}
                <div className="w-14 h-12 rounded-2xl bg-white/95 backdrop-blur px-1.5 py-1 flex items-center justify-center shadow-md border border-orange-200 shrink-0">
                  <img
                    src={logoSrc}
                    alt="Die 48er Logo"
                    className="max-h-full max-w-full object-contain drop-shadow-sm"
                  />
                </div>
                <div>
                  <h1 className="font-extrabold text-lg sm:text-xl leading-tight tracking-tight text-white drop-shadow-sm">
                    Nachrichten- und Redaktionsmedium (NRM)
                  </h1>
                  <p className="text-xs text-orange-100 font-medium">
                    Redaktionsplanung, Datei-Austausch, Abhängigkeiten & WhatsApp/SMS-Reminder
                  </p>
                </div>
              </div>

              <nav className="flex flex-wrap items-center gap-1 bg-orange-900/30 backdrop-blur-sm p-1 rounded-xl border border-white/15">
                <button
                  onClick={() => setActiveTab("dashboard")}
                  className={`px-3 py-1.5 rounded-lg text-sm font-semibold transition ${
                    activeTab === "dashboard" ? "bg-white text-orange-700 shadow-sm" : "text-orange-50 hover:bg-white/10"
                  }`}
                >
                  <i className="fa-solid fa-chart-pie mr-1.5"></i>Dashboard
                </button>
                <button
                  onClick={() => setActiveTab("documents")}
                  className={`px-3 py-1.5 rounded-lg text-sm font-semibold transition ${
                    activeTab === "documents"
                      ? "bg-white text-orange-700 shadow-sm"
                      : "text-orange-50 hover:bg-white/10"
                  }`}
                >
                  <i className="fa-solid fa-file-lines mr-1.5"></i>Dokumente & Dateien
                </button>
                <button
                  onClick={() => setActiveTab("calendar")}
                  className={`px-3 py-1.5 rounded-lg text-sm font-semibold transition ${
                    activeTab === "calendar"
                      ? "bg-white text-orange-700 shadow-sm"
                      : "text-orange-50 hover:bg-white/10"
                  }`}
                >
                  <i className="fa-solid fa-calendar-check mr-1.5"></i>Treffen & Abgaben
                </button>
                <button
                  onClick={() => setActiveTab("team")}
                  className={`px-3 py-1.5 rounded-lg text-sm font-semibold transition ${
                    activeTab === "team"
                      ? "bg-white text-orange-700 shadow-sm"
                      : "text-orange-50 hover:bg-white/10"
                  }`}
                >
                  <i className="fa-solid fa-users mr-1.5"></i>Team & Kontakte
                </button>
              </nav>

              <div className="flex flex-wrap items-center gap-2">
                <label className="flex items-center gap-2 bg-orange-950/40 px-3 py-1.5 border border-white/20 rounded-lg text-xs font-semibold">
                  <i className="fa-solid fa-user"></i> Ich bin …
                  <select aria-label="Mein Profil auswählen" value={selectedMemberId} onChange={e => setSelectedMemberId(e.target.value)}
                    className="bg-white text-orange-900 rounded-md px-2 py-1 max-w-40">
                    <option value="">Teamübersicht</option>
                    {data.members.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
                  </select>
                </label>
                <button

                  <i className="fa-solid fa-download text-amber-200"></i> Stand speichern
                </button>
                <label className="px-3 py-1.5 bg-orange-950/40 hover:bg-orange-950/60 text-white text-xs font-medium rounded-lg border border-white/20 flex items-center gap-1.5 cursor-pointer transition">
                  <i className="fa-solid fa-upload text-amber-200"></i> Stand laden
                  <input type="file" accept=".json" onChange={importData} className="hidden" />
                </label>
              </div>
            </div>

                  <h2 className="text-2xl sm:text-3xl font-extrabold mt-1">{selectedMember ? `Servus, ${selectedMember.name}!` : "Euer Gruppen-Dashboard"}</h2>

                    <p className="text-3xl font-extrabold text-orange-700 mt-2">{selectedMember ? personalDocumentIds.size : data.documents.length}</p>
                    <p className="text-xs text-slate-400 mt-1">{selectedMember ? "Mit meiner Beteiligung" : "Insgesamt"}</p>

                    <p className="text-xs text-slate-500 font-semibold"><i className="fa-solid fa-list-check text-orange-600 mr-1"></i> Offene Aufgaben</p>
                    <p className="text-3xl font-extrabold text-orange-700 mt-2">{unfinishedSteps.length}</p>
                    <p className="text-xs text-slate-400 mt-1">{selectedMember ? "Meine Arbeitsschritte" : "Im gesamten Team"}</p>
                  </div>
                  <div className="bg-white p-4 rounded-2xl border border-orange-200 shadow-sm">
                    <p className="text-xs text-slate-500 font-semibold"><i className="fa-solid fa-lock text-orange-600 mr-1"></i> Wartende Aufgaben</p>
                    <p className="text-3xl font-extrabold text-amber-700 mt-2">{blockedCount}</p>
                    <p className="text-xs text-slate-400 mt-1">Noch nicht freigegeben</p>

                  <div className="bg-white p-4 rounded-2xl border border-orange-200 shadow-sm">
                    <p className="text-xs text-slate-500 font-semibold"><i className="fa-regular fa-calendar text-orange-600 mr-1"></i> Kommende Termine</p>
                    <p className="text-3xl font-extrabold text-orange-700 mt-2">{upcomingEvents.length}</p>
                    <p className="text-xs text-slate-400 mt-1">Inkl. Dokumentenabgaben</p>

                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  <section className="bg-white rounded-2xl p-5 border border-orange-200 shadow-sm">
                    <div className="flex justify-between items-center mb-4 gap-3">
                      <h3 className="font-bold text-lg text-slate-900"><i className="fa-solid fa-list-check text-orange-600 mr-2"></i>{selectedMember ? "Meine Aufgaben" : "Aufgaben des Teams"}</h3>
                      <span className="text-xs bg-orange-100 text-orange-800 px-2 py-1 rounded-full">{unfinishedSteps.length} offen</span>
                    </div>
                    <div className="space-y-2 max-h-96 overflow-y-auto custom-scroll">
                      {unfinishedSteps.length === 0 ? <p className="text-sm text-slate-500 py-6 text-center">Aktuell sind keine offenen Aufgaben vorhanden.</p> :
                        unfinishedSteps.map(step => (
                          <button key={step.doc.id + "_" + step.id} onClick={() => openDocument(step.doc.id)}
                            className="w-full text-left rounded-xl border border-orange-100 hover:border-orange-400 hover:bg-orange-50 p-3 transition">
                            <div className="flex justify-between gap-2 items-start">
                              <span className="font-semibold text-sm text-slate-800">{step.title}</span>
                              <span className={`text-[10px] shrink-0 px-2 py-0.5 rounded-full font-bold ${step.blocked ? "bg-amber-100 text-amber-800" : "bg-emerald-100 text-emerald-800"}`}>{step.blocked ? "Wartet" : "Bereit"}</span>
                            </div>
                            <p className="text-xs text-slate-500 mt-1">{step.doc.title} · {getMember(step.memberId).name}</p>
                            {step.blocked && <p className="text-xs text-amber-700 mt-1">Wartet auf {getMember(step.doc.workflow[step.index - 1].memberId).name}</p>}
                          </button>
                        ))}
                    </div>
                  </section>

                  <section className="bg-white rounded-2xl p-5 border border-orange-200 shadow-sm">
                    <div className="flex flex-wrap justify-between items-center mb-4 gap-3">
                      <h3 className="font-bold text-lg text-slate-900"><i className="fa-solid fa-calendar-days text-orange-600 mr-2"></i>Nächste Termine & Abgaben</h3>
                      <button onClick={() => downloadCalendar(buildCalendarEvents())} className="bg-orange-100 hover:bg-orange-200 text-orange-800 text-xs font-bold px-3 py-2 rounded-lg">
                        <i className="fa-solid fa-file-arrow-down mr-1"></i> .ics exportieren
                      </button>
                    </div>
                    <div className="space-y-2 max-h-96 overflow-y-auto custom-scroll">
                      {upcomingEvents.length === 0 ? <p className="text-sm text-slate-500 py-6 text-center">Keine kommenden Termine eingetragen.</p> :
                        upcomingEvents.slice(0, 10).map(event => (
                          <div key={event.id} className="flex items-start justify-between gap-3 rounded-xl bg-orange-50/50 border border-orange-100 p-3">
                            <div>
                              <span className={`text-[10px] font-bold uppercase rounded-full px-2 py-0.5 ${event.isDeadline ? "bg-red-100 text-red-700" : "bg-orange-100 text-orange-800"}`}>{event.isDeadline ? "Abgabe" : "Treffen"}</span>
                              <p className="text-sm font-semibold text-slate-800 mt-1">{event.title}</p>
                              <p className="text-xs text-slate-500 mt-1">{event.date}{event.time ? ` · ${event.time} Uhr` : " · ganztägig"}</p>
                            </div>
                            <button onClick={() => downloadCalendar([event], "NRM28-" + event.id + ".ics")} title="Kalendereintrag mit Erinnerung herunterladen"
                              className="shrink-0 bg-white rounded-lg border border-orange-200 p-2 text-orange-700 hover:bg-orange-100" aria-label="Kalenderdatei herunterladen">
                              <i className="fa-solid fa-calendar-plus"></i>
                            </button>
                          </div>
                        ))}
                    </div>
                  </section>
                </div>

                <section className="bg-white rounded-2xl border border-orange-200 p-5 shadow-sm">
                  <div className="flex flex-wrap justify-between items-center gap-3 mb-4">
                    <h3 className="font-bold text-lg"><i className="fa-solid fa-bars-progress text-orange-600 mr-2"></i>Fortschritt der Dokumente</h3>
                    <span className="text-xs text-slate-500">{completedSteps} von {allSteps.length} Arbeitsschritten abgeschlossen</span>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    {data.documents.filter(d => !selectedMember || personalDocumentIds.has(d.id)).map(d => (
                      <button key={d.id} onClick={() => openDocument(d.id)} className="rounded-xl text-left p-3 border border-slate-200 hover:border-orange-400 hover:bg-orange-50 transition">
                        <div className="flex items-center justify-between gap-3">
                          <span className="font-semibold text-sm text-slate-800">{d.title}</span>
                          <span className="text-sm font-extrabold text-orange-700">{getProgress(d)}%</span>
                        </div>
                        <div className="h-2 rounded-full overflow-hidden bg-slate-200 mt-2">
                          <div className="h-full rounded-full bg-orange-500" style={{ width: getProgress(d) + "%" }}></div>
                        </div>
                        <p className="text-xs text-slate-500 mt-2">{d.deadline ? `Abgabe: ${d.deadline}` : "Keine Abgabefrist"}</p>
                      </button>
                    ))}
                  </div>
                </section>
                <p className="text-xs text-slate-500">Hinweis: Version 3 speichert weiterhin nur im jeweiligen Browser. WhatsApp/SMS werden nicht automatisch versendet. Kalender-Erinnerungen werden erst nach dem Import der .ics-Datei in einen Kalender aktiv und hängen von dessen Einstellungen ab.</p>
              </div>
            )}

            {/* TAB 1: DOKUMENTE, ÜBERSICHTSBLATT & DATEI-AUSTAUSCH */}
            {activeTab === "documents" && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                {/* LINKE SEITENLEISTE */}
                <div className="lg:col-span-3 space-y-4">
                  <div className="bg-white rounded-2xl p-4 shadow-sm border border-orange-200/70">
                    <div className="flex items-center justify-between mb-3">
                      <h2 className="font-bold text-sm uppercase tracking-wider text-orange-700">Kategorien</h2>
                      <button
                        onClick={() => setNewDocModal(true)}
                        className="bg-orange-600 hover:bg-orange-700 text-white text-xs px-2.5 py-1.5 rounded-lg font-semibold flex items-center gap-1 shadow-sm transition"
                      >
                        <i className="fa-solid fa-plus"></i> Neues Dok
                      </button>
                    </div>

                    <div className="flex flex-wrap gap-1.5 mb-4">
                      <button
                        onClick={() => setSelectedCategory("Alle")}
                        className={`px-2.5 py-1 rounded-lg text-xs font-semibold transition ${
                          selectedCategory === "Alle"
                            ? "bg-orange-600 text-white shadow-sm"
                            : "bg-orange-50 text-slate-700 hover:bg-orange-100"
                        }`}
                      >
                        Alle ({data.documents.length})
                      </button>
                      {data.categories.map(cat => (
                        <button
                          key={cat}
                          onClick={() => setSelectedCategory(cat)}
                          className={`px-2.5 py-1 rounded-lg text-xs font-semibold transition ${
                            selectedCategory === cat
                              ? "bg-orange-600 text-white shadow-sm"
                              : "bg-orange-50 text-slate-700 hover:bg-orange-100"
                          }`}
                        >
                          {cat}
                        </button>
                      ))}
                    </div>

                    <form
                      onSubmit={(e) => {
                        e.preventDefault();
                        if (newCategoryName && !data.categories.includes(newCategoryName)) {
                          setData(prev => ({ ...prev, categories: [...prev.categories, newCategoryName] }));
                          setNewCategoryName("");
                        }
                      }}
                      className="flex gap-1 mb-4"
                    >
                      <input
                        type="text"
                        placeholder="Neue Kategorie..."
                        value={newCategoryName}
                        onChange={e => setNewCategoryName(e.target.value)}
                        className="w-full text-xs px-2.5 py-1.5 rounded-lg border border-orange-200 focus:outline-none focus:ring-2 focus:ring-orange-500"
                      />
                      <button type="submit" className="px-2.5 py-1.5 bg-orange-100 hover:bg-orange-200 text-orange-800 rounded-lg text-xs font-bold">+</button>
                    </form>

                    {selectedMember && (
                      <label className="flex items-center gap-2 text-xs text-orange-800 font-semibold mb-3 cursor-pointer">
                        <input type="checkbox" checked={onlyMyDocuments} onChange={e => setOnlyMyDocuments(e.target.checked)} />
                        Nur meine Dokumente anzeigen
                      </label>
                    )}
                    <h3 className="font-bold text-xs uppercase tracking-wider text-slate-400 mb-2">Beiträge & Dokumente</h3>
                    <div className="space-y-2">
                      {filteredDocs.map(doc => {
                        const prog = getProgress(doc);
                        const days = getDaysLeft(doc.deadline);
                        const isSelected = activeDoc && activeDoc.id === doc.id;
                        const fileCount = (doc.files || []).length;
                        return (
                          <div
                            key={doc.id}
                            onClick={() => setSelectedDocId(doc.id)}
                            className={`p-3 rounded-xl border cursor-pointer transition ${
                              isSelected
                                ? "bg-orange-50/90 border-orange-500 shadow-sm ring-1 ring-orange-500/30"
                                : "bg-white border-slate-200 hover:border-orange-300"
                            }`}
                          >
                            <div className="flex items-center justify-between gap-2 mb-1">
                              <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-orange-100 text-orange-800">
                                {doc.category}
                              </span>
                              <span className={`text-[11px] font-semibold ${days < 3 ? "text-red-600" : "text-slate-500"}`}>

                      onChange={e => setNewDocForm({ ...newDocForm, deadline: e.target.value })}
                      className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                    />
                  </div>
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-600">Kurzbeschreibung</label>
                  <input
                    type="text"
                    placeholder="Worum geht es in diesem Beitrag?"
                    value={newDocForm.description}
                    onChange={e => setNewDocForm({ ...newDocForm, description: e.target.value })}
                    className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                  />
                </div>
                <div className="flex gap-2 justify-end pt-2">
                  <button type="button" onClick={() => setNewDocModal(false)} className="px-4 py-2 text-xs text-slate-600">Abbrechen</button>
                  <button type="submit" className="px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white text-xs font-semibold rounded-xl">Anlegen</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
