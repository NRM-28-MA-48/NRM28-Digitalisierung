                                  onClick={() => {
                                    navigator.clipboard.writeText(activeDoc.content || "");
                                    alert("Text in die Zwischenablage kopiert!");
                                  }}
                                  className="text-xs px-3 py-1.5 bg-orange-50 hover:bg-orange-100 text-orange-800 rounded-lg font-medium border border-orange-200/60"
                                >
                                  <i className="fa-regular fa-copy mr-1"></i> Kopieren
                                </button>
                              </div>

                              <textarea
                                value={activeDoc.content || ""}
                                onChange={e => updateDocContent(e.target.value)}
                                rows={10}
                                className="w-full p-4 rounded-xl bg-orange-50/30 border border-orange-200/80 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                                placeholder="Hier gemeinsam am Artikel oder Dokument schreiben..."
                              />
                            </div>

                            <div className="border-t border-orange-100 pt-4">
                              <h4 className="font-bold text-xs uppercase tracking-wider text-slate-500 mb-2">
                                Übergabe-Kommentare zum Dokument
                              </h4>
                              <div className="space-y-2 max-h-36 overflow-y-auto mb-3">
                                {(activeDoc.notes || []).map(n => (
                                  <div key={n.id} className="p-2.5 rounded-xl bg-orange-50/40 border border-orange-200/60 text-xs">
                                    <div className="flex justify-between font-bold text-slate-700 mb-0.5">
                                      <span>{n.author}</span>
                                      <span className="text-slate-400 font-normal">{n.time}</span>
                                    </div>
                                    <p className="text-slate-600">{n.text}</p>
                                  </div>
                                ))}
                              </div>
                              <form onSubmit={addNote} className="flex gap-2">
                                <input
                                  type="text"
                                  placeholder={`Kommentar als ${currentUser.name} hinterlassen...`}
                                  value={newNoteText}
                                  onChange={e => setNewNoteText(e.target.value)}
                                  className="flex-1 text-xs px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-orange-500"
                                />
                                <button type="submit" className="px-3 py-2 bg-orange-600 text-white text-xs font-semibold rounded-xl hover:bg-orange-700">
                                  Senden
                                </button>
                              </form>
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                ) : (
                  <div className="lg:col-span-9 bg-white rounded-2xl p-8 text-center">Bitte links ein Dokument auswählen oder neu anlegen.</div>
                )}
              </div>
            )}

            {/* TAB 2: INTERAKTIVER KALENDER, TREFFEN & PC-KALENDER-SYNCHRONISATION */}
            {activeTab === "calendar" && (
              <div className="space-y-6">
                {/* OBEN: VISUELLER MONATSKALENDER MIT PC-SYNC BUTTON */}
                <div className="bg-white rounded-2xl p-6 shadow-sm border border-orange-200/70">
                  <div className="flex flex-wrap items-center justify-between gap-4 mb-4 pb-3 border-b border-orange-100">
                    <div>
                      <h2 className="text-xl font-bold text-slate-900 flex items-center gap-2">
                        <i className="fa-solid fa-calendar-days text-orange-600"></i>
                        Redaktionskalender & PC-Synchronisation
                      </h2>
                      <p className="text-xs text-slate-500">
                        Enthält alle Gruppentreffen, Redaktionsschlüsse und Dokumenten-Abgabetermine
                      </p>
                    </div>

                    <div className="flex flex-wrap items-center gap-2">
                      <div className="flex items-center gap-1 bg-orange-50 p-1 rounded-xl border border-orange-200">
                        <button
                          onClick={() => setCalendarMonth(new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() - 1, 1))}
                          className="px-2.5 py-1 hover:bg-white rounded-lg text-xs font-bold text-orange-800"
                        >
                          <i className="fa-solid fa-chevron-left"></i>
                        </button>
                        <span className="px-3 text-xs font-bold text-slate-800 min-w-[130px] text-center">
                          {calendarMonth.toLocaleDateString("de-DE", { month: "long", year: "numeric" })}
                        </span>
                        <button
                          onClick={() => setCalendarMonth(new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + 1, 1))}
                          className="px-2.5 py-1 hover:bg-white rounded-lg text-xs font-bold text-orange-800"
                        >
                          <i className="fa-solid fa-chevron-right"></i>
                        </button>
                      </div>

                      <button
                        onClick={() => downloadICSFile(getAllCalendarEvents(), "NRM-Gesamtkalender.ics")}
                        className="px-3.5 py-2 bg-orange-600 hover:bg-orange-700 text-white rounded-xl text-xs font-semibold flex items-center gap-1.5 shadow-sm transition"
                      >
                        <i className="fa-solid fa-rotate"></i>
                        Alle Termine mit PC-Kalender synchronisieren (.ics)
                      </button>
                    </div>
                  </div>

                  {/* WOCHENTAGE KOPFZEILE */}
                  <div className="grid grid-cols-7 gap-2 mb-2 text-center text-[11px] font-bold uppercase tracking-wider text-slate-400">
                    <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
                  </div>

                  {/* KALENDER RASTER */}
                  <div className="grid grid-cols-7 gap-2">
                    {renderCalendarGrid()}
                  </div>
                </div>

                {/* UNTEN: TERMINLISTE & NEUER TERMIN */}
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div className="lg:col-span-2 bg-white rounded-2xl p-6 shadow-sm border border-orange-200/70">
                    <h3 className="text-lg font-bold mb-1">Terminliste: Sitzungen & Abgabetermine</h3>
                    <p className="text-xs text-slate-500 mb-4">
                      Jeder Termin kann einzeln in den PC-Kalender (Outlook, Apple, Windows, Google) übernommen oder per WhatsApp/SMS erinnert werden
                    </p>

                    <div className="space-y-3">
                      {(data.meetings || []).map(m => (
                        <div key={m.id} className="p-4 rounded-xl border border-orange-200/70 flex flex-wrap items-center justify-between gap-4 bg-orange-50/30">
                          <div className="flex items-center gap-3">
                            <div className={`w-12 h-12 rounded-xl flex flex-col items-center justify-center font-bold text-white shadow-sm ${m.type === "Abgabe" ? "bg-red-600" : "bg-orange-600"}`}>
                              <i className={`fa-solid ${m.type === "Abgabe" ? "fa-flag-checkered" : "fa-handshake"}`}></i>
                            </div>
                            <div>
                              <span className={`text-[10px] font-bold uppercase px-2 py-0.5 rounded-full ${m.type === "Abgabe" ? "bg-red-100 text-red-700" : "bg-orange-100 text-orange-800"}`}>
                                {m.type}
                              </span>
                              <h4 className="font-bold text-slate-900">{m.title}</h4>
                              <p className="text-xs text-slate-600">
                                <i className="fa-regular fa-calendar mr-1 text-orange-600"></i> {m.date} um {m.time} Uhr · <i className="fa-solid fa-location-dot ml-1 mr-1 text-orange-600"></i> {m.location}
                              </p>
                            </div>
                          </div>

                          <div className="flex items-center gap-1.5 flex-wrap">
                            <button
                              onClick={() =>
                                downloadICSFile(
                                  [{
                                    id: m.id,
                                    title: `[NRM ${m.type}] ${m.title}`,
                                    date: m.date,
                                    time: m.time,
                                    location: m.location,
                                    description: `Termin aus dem Nachrichten- und Redaktionsmedium (NRM)`
                                  }],
                                  `NRM-${m.title.replace(/[^a-zA-Z0-9]/g, "_")}.ics`
                                )
                              }
                              title="Diesen Termin in den PC-Kalender (Outlook / Windows / Apple) eintragen"
                              className="px-2.5 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-semibold flex items-center gap-1"
                            >
                              <i className="fa-regular fa-calendar-plus"></i> PC-Kalender
                            </button>
                            <button
                              onClick={() =>
                                sendWhatsApp(
                                  "",
                                  `📅 *NRM-Erinnerung (${m.type})*: "${m.title}"\n🕒 Wann: ${m.date} um ${m.time} Uhr\n📍 Wo: ${m.location}\nBitte pünktlich sein / rechtzeitig eintragen!`
                                )
                              }
                              className="px-3 py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl text-xs font-semibold flex items-center gap-1"
                            >
                              <i className="fa-brands fa-whatsapp text-sm"></i> WhatsApp
                            </button>
                            <button
                              onClick={() =>
                                sendSMS(
                                  (data.members || []).map(mem => mem.phone).join(","),
                                  `NRM-Erinnerung (${m.type}): "${m.title}" am ${m.date} um ${m.time} Uhr (${m.location}).`
                                )
                              }
                              className="px-3 py-2 bg-orange-600 hover:bg-orange-700 text-white rounded-xl text-xs font-semibold flex items-center gap-1"
                            >
                              <i className="fa-solid fa-comment-sms text-sm"></i> SMS
                            </button>
                            <button
                              onClick={() => setEditingMeeting({ ...m })}
                              title="Termin bearbeiten"
                              className="p-2 bg-orange-100 hover:bg-orange-200 text-orange-800 rounded-xl text-xs"
                            >
                              <i className="fa-solid fa-pen"></i>
                            </button>
                            <button
                              onClick={() => deleteMeeting(m.id)}
                              title="Termin löschen"
                              className="p-2 bg-red-100 hover:bg-red-200 text-red-600 rounded-xl text-xs"
                            >
                              <i className="fa-solid fa-trash"></i>
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="bg-white rounded-2xl p-6 shadow-sm border border-orange-200/70 h-fit">
                    <h3 className="font-bold text-lg mb-3">Neuen Termin eintragen</h3>
                    <form
                      onSubmit={e => {
                        e.preventDefault();
                        if (!newMeetingForm.title || !newMeetingForm.date) return;
                        const created = { ...newMeetingForm, id: "mt_" + Date.now() };
                        updateDataAndCloud(prev => ({
                          ...prev,
                          meetings: [...(prev.meetings || []), created]
                        }));
                        setNewMeetingForm({ title: "", date: "", time: "17:00", location: "", type: "Treffen" });
                      }}
                      className="space-y-3"
                    >
                      <div>
                        <label className="text-xs font-semibold text-slate-600">Art des Termins</label>
                        <select
                          value={newMeetingForm.type}
                          onChange={e => setNewMeetingForm({ ...newMeetingForm, type: e.target.value })}
                          className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white"
                        >
                          <option value="Treffen">Redaktionssitzung / Treffen</option>
                          <option value="Abgabe">Redaktionsschluss / Abgabe</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-xs font-semibold text-slate-600">Titel</label>
                        <input
                          type="text"
                          required
                          placeholder="z.B. Redaktionskonferenz"
                          value={newMeetingForm.title}
                          onChange={e => setNewMeetingForm({ ...newMeetingForm, title: e.target.value })}
                          className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                        />
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="text-xs font-semibold text-slate-600">Datum</label>
                          <input
                            type="date"
                            required
                            value={newMeetingForm.date}
                            onChange={e => setNewMeetingForm({ ...newMeetingForm, date: e.target.value })}
                            className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                          />
                        </div>
                        <div>
                          <label className="text-xs font-semibold text-slate-600">Uhrzeit</label>
                          <input
                            type="time"
                            value={newMeetingForm.time}
                            onChange={e => setNewMeetingForm({ ...newMeetingForm, time: e.target.value })}
                            className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                          />
                        </div>
                      </div>
                      <div>
                        <label className="text-xs font-semibold text-slate-600">Ort / Link</label>
                        <input
                          type="text"
                          placeholder="z.B. Zoom-Link oder Büro"
                          value={newMeetingForm.location}
                          onChange={e => setNewMeetingForm({ ...newMeetingForm, location: e.target.value })}
                          className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                        />
                      </div>
                      <button type="submit" className="w-full py-2.5 bg-orange-600 hover:bg-orange-700 text-white font-semibold rounded-xl text-sm shadow-sm transition">
                        Termin speichern
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: TEAMMITGLIEDER, ROLLEN-DROPDOWN & KONTAKTE */}
            {activeTab === "team" && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="lg:col-span-2 bg-white rounded-2xl p-6 shadow-sm border border-orange-200/70">
                  <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
                    <div>
                      <h2 className="text-xl font-bold">Redaktionsteam & Kontakte</h2>
                      <p className="text-xs text-slate-500">
                        Rollen steuern die Berechtigungen: <strong>Teamleiter</strong> sowie die jeweils zugewiesene Person dürfen Arbeitsschritte abhaken.
                      </p>
                    </div>
                    {(data.members || []).length > 0 && (
                      <button
                        onClick={() => {
                          if (confirm("Möchtest du wirklich ALLE Kontakte auf einmal löschen?")) {
                            updateDataAndCloud(prev => ({ ...prev, members: [] }));
                          }
                        }}
                        className="text-xs px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg font-medium"
                      >
                        <i className="fa-solid fa-trash-can mr-1"></i> Alle Kontakte leeren
                      </button>
                    )}
                  </div>

                  {(data.members || []).length === 0 ? (
                    <div className="p-8 text-center text-slate-500 text-sm border border-dashed rounded-xl">
                      Noch keine Teammitglieder eingetragen. Füge rechts deine Kolleginnen und Kollegen hinzu!
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      {(data.members || []).map(m => (
                        <div key={m.id} className="p-4 rounded-xl border border-orange-200/70 flex items-center justify-between bg-orange-50/30">
                          <div className="flex items-center gap-3 min-w-0">
                            <div className={`w-10 h-10 rounded-full ${m.color} text-white flex items-center justify-center font-bold shrink-0 shadow-sm`}>
                              {m.name.slice(0, 2).toUpperCase()}
                            </div>
                            <div className="min-w-0">
                              <div className="flex items-center gap-1.5 flex-wrap">
                                <h3 className="font-bold text-slate-900 text-sm truncate">{m.name}</h3>
                                {m.role === "Teamleiter" && (
                                  <i className="fa-solid fa-crown text-amber-500 text-xs" title="Teamleiter (darf alle Schritte freigeben)"></i>
                                )}
                              </div>
                              <span className={`inline-block text-[11px] px-2 py-0.5 rounded-md font-semibold mt-0.5 ${getRoleBadgeStyle(m.role)}`}>
                                {m.role}
                              </span>
                              <p className="text-xs font-mono text-slate-600 mt-1">{m.phone}</p>
                            </div>
                          </div>
                          <div className="flex gap-1 shrink-0">
                            <button
                              onClick={() => sendWhatsApp(m.phone, `Hallo ${m.name}! 👋`)}
                              title="WhatsApp senden"
                              className="p-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-lg text-xs"
                            >
                              <i className="fa-brands fa-whatsapp"></i>
                            </button>
                            <button
                              onClick={() => sendSMS(m.phone, `Hallo ${m.name}!`)}
                              title="SMS senden"
                              className="p-2 bg-orange-600 hover:bg-orange-700 text-white rounded-lg text-xs"
                            >
                              <i className="fa-solid fa-comment-sms"></i>
                            </button>
                            <button
                              onClick={() => openEditMemberModal(m)}
                              title={`${m.name} bearbeiten`}
                              className="p-2 bg-orange-100 hover:bg-orange-200 text-orange-800 rounded-lg text-xs"
                            >
                              <i className="fa-solid fa-pen"></i>
                            </button>
                            <button
                              onClick={() => deleteMember(m.id, m.name)}
                              title={`${m.name} löschen`}
                              className="p-2 bg-red-100 hover:bg-red-200 text-red-600 rounded-lg text-xs"
                            >
                              <i className="fa-solid fa-trash"></i>
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* PERSON HINZUFÜGEN MIT ROLLEN-DROPDOWN */}
                <div className="bg-white rounded-2xl p-6 shadow-sm border border-orange-200/70 h-fit">
                  <h3 className="font-bold text-lg mb-3">Person hinzufügen</h3>
                  <form
                    onSubmit={e => {
                      e.preventDefault();
                      if (!newMemberForm.name) return;
                      const finalRole = newMemberForm.roleType === "andere"
                        ? (newMemberForm.customRole.trim() || "Andere")
                        : newMemberForm.roleType;

                      const colors = ["bg-orange-600", "bg-amber-600", "bg-red-600", "bg-blue-600", "bg-emerald-600", "bg-purple-600"];
                      const newId = "m_" + Date.now();
                      updateDataAndCloud(prev => ({
                        ...prev,
                        members: [
                          ...(prev.members || []),
                          {
                            id: newId,
                            name: newMemberForm.name,
                            role: finalRole,
                            phone: newMemberForm.phone || "+43664...",
                            color: colors[(prev.members || []).length % colors.length]
                          }
                        ]
                      }));
                      setNewMemberForm({ name: "", roleType: "MitarbeiterIn", customRole: "", phone: "" });
                    }}
                    className="space-y-3"
                  >
                    <div>
                      <label className="text-xs font-semibold text-slate-600">Name</label>
                      <input
                        type="text"
                        required
                        placeholder="Name (z.B. Lisa M.)"
                        value={newMemberForm.name}
                        onChange={e => setNewMemberForm({ ...newMemberForm, name: e.target.value })}
                        className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-semibold text-slate-600">Rolle auswählen</label>
                      <select
                        value={newMemberForm.roleType}
                        onChange={e => setNewMemberForm({ ...newMemberForm, roleType: e.target.value })}
                        className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white"
                      >
                        <option value="Teamleiter">Teamleiter</option>
                        <option value="MitarbeiterIn">MitarbeiterIn</option>
                        <option value="Support">Support</option>
                        <option value="andere">andere (frei eingeben...)</option>
                      </select>
                    </div>

                    {newMemberForm.roleType === "andere" && (
                      <div>
                        <label className="text-xs font-semibold text-orange-700">Eigene Rolle / Bezeichnung eingeben</label>
                        <input
                          type="text"
                          required
                          placeholder="Beliebige Rolle hinschreiben (z.B. Fotografie, Gastautor)..."
                          value={newMemberForm.customRole}
                          onChange={e => setNewMemberForm({ ...newMemberForm, customRole: e.target.value })}
                          className="w-full mt-1 px-3 py-2 rounded-xl border border-orange-300 bg-orange-50/40 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                        />
                      </div>
                    )}

                    <div>
                      <label className="text-xs font-semibold text-slate-600">Telefonnummer (für WhatsApp & SMS)</label>
                      <input
                        type="text"
                        placeholder="Telefonnummer (+43...)"
                        value={newMemberForm.phone}
                        onChange={e => setNewMemberForm({ ...newMemberForm, phone: e.target.value })}
                        className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                      />
                    </div>

                    <button type="submit" className="w-full py-2.5 bg-orange-600 hover:bg-orange-700 text-white font-semibold rounded-xl text-sm shadow-sm transition">
                      Mitglied speichern
                    </button>
                  </form>
                </div>
              </div>
            )}
          </main>

          {/* MODAL: GRUPPENMITGLIED BEARBEITEN (INKL. ROLLEN-DROPDOWN) */}
          {editingMember && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <form onSubmit={saveEditedMember} className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
                <h3 className="font-bold text-lg">Kontakt & Rolle bearbeiten</h3>
                <div>
                  <label className="text-xs font-semibold text-slate-600">Name</label>
                  <input
                    type="text"
                    required
                    value={editingMember.name}
                    onChange={e => setEditingMember({ ...editingMember, name: e.target.value })}
                    className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                  />
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-600">Rolle</label>
                  <select
                    value={editingMember.roleType}
                    onChange={e => setEditingMember({ ...editingMember, roleType: e.target.value })}
                    className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white"
                  >
                    <option value="Teamleiter">Teamleiter</option>
                    <option value="MitarbeiterIn">MitarbeiterIn</option>
                    <option value="Support">Support</option>
                    <option value="andere">andere (frei eingeben...)</option>
                  </select>
                </div>
                {editingMember.roleType === "andere" && (
                  <div>
                    <label className="text-xs font-semibold text-orange-700">Eigene Rolle / Bezeichnung</label>
                    <input
                      type="text"
                      required
                      placeholder="Rolle frei eingeben..."
                      value={editingMember.customRole}
                      onChange={e => setEditingMember({ ...editingMember, customRole: e.target.value })}
                      className="w-full mt-1 px-3 py-2 rounded-xl border border-orange-300 bg-orange-50/40 text-sm"
                    />
                  </div>
                )}
                <div>
                  <label className="text-xs font-semibold text-slate-600">Telefonnummer (für WhatsApp & SMS)</label>
                  <input
                    type="text"
                    value={editingMember.phone}
                    onChange={e => setEditingMember({ ...editingMember, phone: e.target.value })}
                    className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                  />
                </div>
                <div className="flex gap-2 justify-end pt-2">
                  <button type="button" onClick={() => setEditingMember(null)} className="px-4 py-2 text-xs text-slate-600">Abbrechen</button>
                  <button type="submit" className="px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white text-xs font-semibold rounded-xl">Änderungen speichern</button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL: DOKUMENT-STECKBRIEF BEARBEITEN */}
          {editingDocMeta && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <form onSubmit={saveEditedDocMeta} className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
                <h3 className="font-bold text-lg">Dokument-Steckbrief bearbeiten</h3>
                <div>
                  <label className="text-xs font-semibold text-slate-600">Titel</label>
                  <input
                    type="text"
                    required
                    value={editingDocMeta.title}
                    onChange={e => setEditingDocMeta({ ...editingDocMeta, title: e.target.value })}
                    className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                  />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-xs font-semibold text-slate-600">Kategorie</label>
                    <select
                      value={editingDocMeta.category}
                      onChange={e => setEditingDocMeta({ ...editingDocMeta, category: e.target.value })}
                      className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white"
                    >
                      {(data.categories || []).map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600">Abgabetermin</label>
                    <input
                      type="date"
                      value={editingDocMeta.deadline}
                      onChange={e => setEditingDocMeta({ ...editingDocMeta, deadline: e.target.value })}
                      className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                    />
                  </div>
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-600">Kurzbeschreibung</label>
                  <input
                    type="text"
                    value={editingDocMeta.description}
                    onChange={e => setEditingDocMeta({ ...editingDocMeta, description: e.target.value })}
                    className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                  />
                </div>
                <div className="flex gap-2 justify-end pt-2">
                  <button type="button" onClick={() => setEditingDocMeta(null)} className="px-4 py-2 text-xs text-slate-600">Abbrechen</button>
                  <button type="submit" className="px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white text-xs font-semibold rounded-xl">Speichern</button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL: ABHÄNGIGKEITS-SCHRITT BEARBEITEN */}
          {editingStep && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <form onSubmit={saveEditedStep} className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
                <h3 className="font-bold text-lg">Arbeitsschritt bearbeiten</h3>
                <div>
                  <label className="text-xs font-semibold text-slate-600">Beschreibung des Schritts</label>
                  <input
                    type="text"
                    required
                    value={editingStep.title}
                    onChange={e => setEditingStep({ ...editingStep, title: e.target.value })}
                    className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                  />
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-600">Zuständige Person</label>
                  <select
                    value={editingStep.memberId}
                    onChange={e => setEditingStep({ ...editingStep, memberId: e.target.value })}
                    className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white"
                  >
                    {(data.members || []).map(m => <option key={m.id} value={m.id}>{m.name} ({m.role})</option>)}
                  </select>
                </div>
                <div className="flex gap-2 justify-end pt-2">
                  <button type="button" onClick={() => setEditingStep(null)} className="px-4 py-2 text-xs text-slate-600">Abbrechen</button>
                  <button type="submit" className="px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white text-xs font-semibold rounded-xl">Speichern</button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL: TERMIN BEARBEITEN */}
          {editingMeeting && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <form onSubmit={saveEditedMeeting} className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
                <h3 className="font-bold text-lg">Termin bearbeiten</h3>
                <div>

                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>

    function App() {
      const [logoSrc, setLogoSrc] = useState(FALLBACK_48ER_SVG);
      const [syncStatus, setSyncStatus] = useState("Verbinde mit Cloud...");
      const [syncError, setSyncError] = useState(null);

      // Verhindert, dass eingehende Snapshots eigene ungespeicherte Tipp-Änderungen überschreiben
      const isSavingRef = useRef(false);
      const saveTimeoutRef = useRef(null);

      const [data, setData] = useState(() => {
        const saved = localStorage.getItem("nrm_data_v2") || localStorage.getItem("nrm_data_v1");
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            parsed.documents = (parsed.documents || []).map(d => ({
              ...d,
              files: d.files || [],
              notes: d.notes || [],
              responsibilities: d.responsibilities || [],
              workflow: d.workflow || []
            }));
            return parsed;
          } catch (e) {
            return INITIAL_DATA;
          }
        }
        return INITIAL_DATA;
      });

      const [currentUserId, setCurrentUserId] = useState(() => {
        return localStorage.getItem("nrm_current_user_id") || "m1";
      });

      useEffect(() => {
        if (currentUserId) {
          localStorage.setItem("nrm_current_user_id", currentUserId);
        }
      }, [currentUserId]);

      useEffect(() => {
        if (data.members && data.members.length > 0) {
          const exists = data.members.some(m => m.id === currentUserId);
          if (!exists) {
            setCurrentUserId(data.members[0].id);
          }
        }
      }, [data.members]);

      // 48er.png laden und weißen Hintergrund transparent freistellen
      useEffect(() => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          try {
            const canvas = document.createElement("canvas");
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = imgData.data;

            for (let i = 0; i < d.length; i += 4) {
              const r = d[i], g = d[i + 1], b = d[i + 2];
              if (r > 240 && g > 240 && b > 240) {
                d[i + 3] = 0;
              } else if (r > 215 && g > 215 && b > 215 && Math.abs(r - g) < 15 && Math.abs(r - b) < 15) {
                const brightness = (r + g + b) / 3;
                d[i + 3] = Math.max(0, Math.min(255, Math.round((240 - brightness) * 10)));
              }
            }
            ctx.putImageData(imgData, 0, 0);
            const transparentDataUrl = canvas.toDataURL("image/png");
            setLogoSrc(transparentDataUrl);

            const fav = document.getElementById("app-favicon");
            const touch = document.getElementById("app-touch-icon");
            if (fav) fav.href = transparentDataUrl;
            if (touch) touch.href = transparentDataUrl;
          } catch (e) {
            setLogoSrc("48er.png");
          }
        };
        img.src = "48er.png";
      }, []);

      // Hilfsfunktion: Bereinigt undefined-Werte, da Firestore bei 'undefined' das Speichern komplett abbricht!
      const sanitizeForFirestore = (obj) => {
        return JSON.parse(JSON.stringify(obj));
      };

      // Direktes Schreiben in Firebase mit klarer Fehlermeldung
      const pushToFirestore = async (payload) => {
        if (!window.nrmFirebase) return;
        const { db, doc, setDoc } = window.nrmFirebase;
        const docRef = doc(db, "nrm_projekte", "hauptstand");
        try {
          isSavingRef.current = true;
          setSyncStatus("💾 Speichere in Cloud...");
          const cleanPayload = sanitizeForFirestore(payload);
          await setDoc(docRef, cleanPayload);
          setSyncError(null);
          setSyncStatus("✅ Alle Änderungen in Cloud gespeichert");
        } catch (err) {
          console.error("Cloud-Speicherfehler:", err);
          if (err.code === "permission-denied") {
            setSyncError("Schreibzugriff blockiert! Bitte in Firebase Console -> Firestore -> Regeln 'allow read, write: if true;' aktivieren.");
            setSyncStatus("⚠️ Cloud-Schreibschutz aktiv (Nur lokal gespeichert)");
          } else {
            setSyncError(`Speicherfehler: ${err.message}`);
            setSyncStatus("⚠️ Fehler beim Cloud-Speichern");
          }
        } finally {
          setTimeout(() => {
            isSavingRef.current = false;
          }, 400);
        }
      };

      // Firebase Echtzeit-Synchronisation (Initialisierung + Live-Empfang)
      useEffect(() => {
        let unsubscribe = null;

        const initFirebaseSync = () => {
          if (!window.nrmFirebase) return;
          const { db, doc, onSnapshot } = window.nrmFirebase;
          const docRef = doc(db, "nrm_projekte", "hauptstand");

          unsubscribe = onSnapshot(
            docRef,
            (snapshot) => {
              // Eigene lokale Schreibvorgänge nicht sofort wieder überschreiben
              if (snapshot.metadata.hasPendingWrites || isSavingRef.current) {
                return;
              }

              if (snapshot.exists()) {
                const cloudData = snapshot.data();
                cloudData.documents = (cloudData.documents || []).map(d => ({
                  ...d,
                  files: d.files || [],
                  notes: d.notes || [],
                  responsibilities: d.responsibilities || [],
                  workflow: d.workflow || []
                }));
                setData(cloudData);
                try {
                  localStorage.setItem("nrm_data_v2", JSON.stringify(cloudData));
                } catch (e) {}
                setSyncError(null);
                setSyncStatus("Live verbunden (Cloud)");
              } else {
                // Erstmaliges Anlegen in der Cloud
                pushToFirestore(INITIAL_DATA);
              }
            },
            (error) => {
              console.error("Firestore Listener Error:", error);
              if (error.code === "permission-denied") {
                setSyncError("Zugriff verweigert! Bitte in der Firebase Console unter 'Firestore Database -> Regeln' den Lese-/Schreibzugriff freigeben.");
              }
              setSyncStatus("Offline-Modus (Lokal)");
            }
          );
        };

        if (window.nrmFirebase) {
          initFirebaseSync();
        } else {
          window.addEventListener("firebase-ready", initFirebaseSync);
        }

        return () => {
          if (unsubscribe) unsubscribe();
        };
      }, []);

      // Speichert Änderungen sofort lokal und verzögerungsfrei (bzw. beim Tippen leicht gebündelt) in Firebase
      const updateDataAndCloud = (updater, debounceMs = 0) => {
        setData(prev => {
          const newData = typeof updater === "function" ? updater(prev) : updater;
          try {
            localStorage.setItem("nrm_data_v2", JSON.stringify(newData));
          } catch (e) {
            console.warn("Lokaler Speicher voll:", e);
          }

          if (saveTimeoutRef.current) {
            clearTimeout(saveTimeoutRef.current);
          }

          if (debounceMs > 0) {
            setSyncStatus("✏️ Tippe... (speichert gleich)");
            saveTimeoutRef.current = setTimeout(() => {
              pushToFirestore(newData);
            }, debounceMs);
          } else {
            pushToFirestore(newData);
          }

          return newData;
        });
      };

      const [selectedCategory, setSelectedCategory] = useState("Alle");
      const [selectedDocId, setSelectedDocId] = useState(data.documents[0]?.id || null);

      const [editingStep, setEditingStep] = useState(null);

      const activeDoc = (data.documents || []).find(d => d.id === selectedDocId) || (data.documents || [])[0];

      const getMember = (id) => (data.members || []).find(m => m.id === id) || { id: "", name: "Redaktionsmitglied", phone: "", color: "bg-orange-500", role: "MitarbeiterIn" };

      const currentUser = getMember(currentUserId);
      const isCurrentUserLeader = currentUser && currentUser.role === "Teamleiter";

      const canUserToggleStep = (step) => {
        if (!currentUser) return false;
        return currentUser.role === "Teamleiter" || step.memberId === currentUser.id;
      };

      const getProgress = (doc) => {
        if (!doc || !doc.workflow || doc.workflow.length === 0) return 0;
        const doneCount = doc.workflow.filter(w => w.done).length;
        return Math.round((doneCount / doc.workflow.length) * 100);
      };

      const getDaysLeft = (dateStr) => {
        if (!dateStr) return null;
        const diff = new Date(dateStr) - new Date();
        return Math.ceil(diff / (1000 * 60 * 60 * 24));
      };

      const formatFileSize = (bytes) => {
        if (!bytes) return "";
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / 1048576).toFixed(2) + " MB";
      };

      // --- KALENDER-SYNCHRONISATION (.ICS) ---
      const createICSDateTime = (dateStr, timeStr = "09:00", addHours = 0) => {
        const cleanDate = (dateStr || "2026-11-10").replace(/-/g, "");
        const parts = (timeStr || "09:00").split(":");
        let hour = parseInt(parts[0] || "9", 10) + addHours;
        const minute = parts[1] || "00";
        if (hour >= 24) hour = 23;
        const hh = String(hour).padStart(2, "0");
        return `${cleanDate}T${hh}${minute}00`;
      };

      const downloadICSFile = (eventsList, filename = "NRM-Kalender-Sync.ics") => {
        if (!eventsList || eventsList.length === 0) {
          alert("Keine Termine zum Synchronisieren vorhanden.");
          return;
        }
        const nowStamp = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
        const lines = [
          "BEGIN:VCALENDAR",
          "VERSION:2.0",
          "PRODID:-//Nachrichten- und Redaktionsmedium (NRM)//DE",
          "CALSCALE:GREGORIAN",
          "METHOD:PUBLISH",
          "X-WR-CALNAME:NRM Redaktionskalender"
        ];

        eventsList.forEach(ev => {
          const dtStart = createICSDateTime(ev.date, ev.time || "09:00", 0);
          const dtEnd = createICSDateTime(ev.date, ev.time || "09:00", 1);
          lines.push(
            "BEGIN:VEVENT",
            `UID:${ev.id}@nrm-redaktion.local`,
            `DTSTAMP:${nowStamp}`,
            `DTSTART:${dtStart}`,
            `DTEND:${dtEnd}`,
            `SUMMARY:${(ev.title || "").replace(/[,;\\]/g, " ")}`,
            `LOCATION:${(ev.location || "NRM Redaktion").replace(/[,;\\]/g, " ")}`,
            `DESCRIPTION:${(ev.description || "Termin aus dem Nachrichten- und Redaktionsmedium (NRM)").replace(/\n/g, "\\n")}`,
            "BEGIN:VALARM",
            "TRIGGER:-PT24H",
            "ACTION:DISPLAY",
            "DESCRIPTION:Erinnerung: NRM Termin",
            "END:VALARM",
            "END:VEVENT"
          );
        });

        lines.push("END:VCALENDAR");

        const blob = new Blob([lines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      };

      const getAllCalendarEvents = () => {
        const meetingEvents = (data.meetings || []).map(m => ({
          id: m.id,
          title: `[${m.type}] ${m.title}`,
          rawTitle: m.title,
          date: m.date,
          time: m.time || "17:00",
          location: m.location || "Redaktion",
          type: m.type,
          description: `NRM ${m.type}: ${m.title} (${m.location || ""})`,
          isDocDeadline: false,
          originalMeeting: m
        }));

        const docDeadlineEvents = (data.documents || [])
          .filter(d => d.deadline)
          .map(d => ({
            id: "doc_dl_" + d.id,
            title: `[Dokument-Abgabe] ${d.title}`,
            rawTitle: `Abgabe: ${d.title}`,
            date: d.deadline,
            time: "23:59",
            location: `Kategorie: ${d.category}`,
            type: "Dokument-Deadline",
            description: `Abgabetermin für Dokument "${d.title}" (${getProgress(d)}% erledigt).`,
            isDocDeadline: true,
            docId: d.id
          }));

        return [...meetingEvents, ...docDeadlineEvents].sort((a, b) => (a.date || "").localeCompare(b.date || ""));
      };

      const sendWhatsApp = (phone, message) => {
        const cleanPhone = (phone || "").replace(/[^0-9+]/g, "").replace(/^\+/, "");
        const url = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;
        window.open(url, "_blank");
      };

      const sendSMS = (phone, message) => {
        const cleanPhone = (phone || "").replace(/[^0-9+,]/g, "");
        const url = `sms:${cleanPhone}?body=${encodeURIComponent(message)}`;
        window.location.href = url;
      };

      // --- DATEI HOCHLADEN & HERUNTERLADEN (INKL. 700 KB CLOUD-SCHUTZ) ---
      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file || !activeDoc) return;

        // Firestore hat ein hartes 1-MB-Limit pro Gesamtdokument!
        if (file.size > 700 * 1024) {
          alert("Achtung: Diese Datei ist größer als 700 KB!\n\nDa die kostenlose Cloud-Datenbank (Firestore) maximal 1 MB pro Projektstand erlaubt, würde eine so große Datei das Cloud-Speichern blockieren.\n\nBitte nutze für größere Dateien rechts oben den Button 'Cloud-Link ergänzen' (z.B. Google Drive, OneDrive, Dropbox).");
          e.target.value = "";
          return;
        }

        const reader = new FileReader();
        reader.onload = (ev) => {
          const uploader = uploadMemberId ? getMember(uploadMemberId).name : currentUser.name;
          const newFileEntry = {
            id: "f_" + Date.now(),
            name: file.name,
            size: file.size,
            type: file.type || "application/octet-stream",
            dataUrl: ev.target.result,
            uploadedBy: uploader,
            comment: uploadComment || "Zur weiteren Bearbeitung",
            uploadedAt: new Date().toLocaleString("de-DE"),
            isExternal: false
          };

          updateDataAndCloud(prev => ({
            ...prev,
            documents: prev.documents.map(d =>
              d.id === activeDoc.id ? { ...d, files: [newFileEntry, ...(d.files || [])] } : d
            )
          }));
          setUploadComment("");
          e.target.value = "";
        };
        reader.readAsDataURL(file);
      };

      const handleAddExternalLink = (e) => {
        e.preventDefault();
        if (!externalLinkForm.name || !externalLinkForm.url || !activeDoc) return;
        const uploader = externalLinkForm.memberId ? getMember(externalLinkForm.memberId).name : currentUser.name;
        const newLinkEntry = {
          id: "f_" + Date.now(),
          name: externalLinkForm.name,
          size: 0,
          type: "link",
          dataUrl: externalLinkForm.url,
          uploadedBy: uploader,
          comment: "Externer Cloud-Link",
          uploadedAt: new Date().toLocaleString("de-DE"),
          isExternal: true
        };

        updateDataAndCloud(prev => ({
          ...prev,
          documents: prev.documents.map(d =>
            d.id === activeDoc.id ? { ...d, files: [newLinkEntry, ...(d.files || [])] } : d
          )
        }));
        setExternalLinkForm({ name: "", url: "", memberId: "" });
        setShowLinkForm(false);
      };

      const deleteFile = (fileId) => {
        if (!confirm("Diesen Datei-Anhang wirklich entfernen?")) return;
        updateDataAndCloud(prev => ({
          ...prev,
          documents: prev.documents.map(d =>
            d.id === activeDoc.id ? { ...d, files: (d.files || []).filter(f => f.id !== fileId) } : d
          )
        }));
      };

      // --- BEARBEITEN-FUNKTIONEN ---
      const openEditMemberModal = (member) => {
        const isPredefined = PREDEFINED_ROLES.includes(member.role);
        setEditingMember({
          ...member,
          roleType: isPredefined ? member.role : "andere",
          customRole: isPredefined ? "" : member.role
        });
      };

      const saveEditedMember = (e) => {
        e.preventDefault();
        if (!editingMember || !editingMember.name) return;
        const finalRole = editingMember.roleType === "andere"
          ? (editingMember.customRole.trim() || "Andere")
          : editingMember.roleType;

        const updatedMember = {
          id: editingMember.id,
          name: editingMember.name,
          role: finalRole,
          phone: editingMember.phone || "",
          color: editingMember.color || "bg-orange-600"
        };

        updateDataAndCloud(prev => ({
          ...prev,
          members: prev.members.map(m => m.id === updatedMember.id ? updatedMember : m)
        }));
        setEditingMember(null);
      };

      const saveEditedMeeting = (e) => {
        e.preventDefault();
        if (!editingMeeting || !editingMeeting.title) return;
        updateDataAndCloud(prev => ({
          ...prev,
          meetings: prev.meetings.map(m => m.id === editingMeeting.id ? editingMeeting : m)
        }));
        setEditingMeeting(null);
      };

      const saveEditedDocMeta = (e) => {
        e.preventDefault();
        if (!editingDocMeta || !editingDocMeta.title) return;
        updateDataAndCloud(prev => ({
          ...prev,
          documents: prev.documents.map(d =>
            d.id === editingDocMeta.id
              ? { ...d, title: editingDocMeta.title, category: editingDocMeta.category, deadline: editingDocMeta.deadline || "", description: editingDocMeta.description || "" }
              : d
          )
        }));
        setEditingDocMeta(null);
      };

      const saveEditedStep = (e) => {
        e.preventDefault();
        if (!editingStep || !editingStep.title) return;
        updateDataAndCloud(prev => ({
          ...prev,
          documents: prev.documents.map(d => {
            if (d.id !== activeDoc.id) return d;
            return {
              ...d,
              workflow: d.workflow.map(w => w.id === editingStep.id ? { ...w, title: editingStep.title, memberId: editingStep.memberId } : w)
            };
          })
        }));
        setEditingStep(null);
      };

      // --- LÖSCH-FUNKTIONEN ---
      const deleteMember = (memberId, memberName) => {
        if (!confirm(`Möchtest du "${memberName}" wirklich aus den Kontakten löschen?`)) return;
        updateDataAndCloud(prev => ({
          ...prev,
          members: prev.members.filter(m => m.id !== memberId),
          documents: prev.documents.map(doc => ({
            ...doc,
            responsibilities: (doc.responsibilities || []).filter(r => r.memberId !== memberId),
            workflow: (doc.workflow || []).filter(w => w.memberId !== memberId)
          }))
        }));
      };

      const deleteDocument = (docId, docTitle) => {
        if (!confirm(`Dokument "${docTitle}" wirklich unwiderruflich löschen?`)) return;
        updateDataAndCloud(prev => {
          const remaining = prev.documents.filter(d => d.id !== docId);
          if (selectedDocId === docId) {
            setSelectedDocId(remaining[0]?.id || null);
          }
          return { ...prev, documents: remaining };
        });
      };

      const deleteWorkflowStep = (stepId) => {
        updateDataAndCloud(prev => ({
          ...prev,
          documents: prev.documents.map(d => {
            if (d.id !== activeDoc.id) return d;
            return { ...d, workflow: d.workflow.filter(w => w.id !== stepId) };
          })
        }));
      };

      const deleteResponsibility = (index) => {
        updateDataAndCloud(prev => ({
          ...prev,
          documents: prev.documents.map(d => {
            if (d.id !== activeDoc.id) return d;
            return { ...d, responsibilities: d.responsibilities.filter((_, i) => i !== index) };
          })
        }));
      };

      const deleteMeeting = (meetingId) => {
        if (!confirm("Diesen Termin wirklich löschen?")) return;
        updateDataAndCloud(prev => ({
          ...prev,
          meetings: prev.meetings.filter(m => m.id !== meetingId)
        }));
      };

      // --- ABHÄNGIGKEITS-SCHRITT UMSCHALTEN ---
      const toggleWorkflowStep = (docId, stepIndex) => {
        const targetDoc = (data.documents || []).find(d => d.id === docId);
        if (!targetDoc) return;
        const targetStep = targetDoc.workflow[stepIndex];
        if (!targetStep) return;

        const assignedPerson = getMember(targetStep.memberId);

        if (!canUserToggleStep(targetStep)) {
          alert(
            `Berechtigung eingeschränkt:\n\nNur der Teamleiter oder die für diesen Arbeitsschritt zuständige Person (${assignedPerson.name}) darf diesen Task abhaken!\n\nDu bist aktuell oben rechts als "${currentUser.name}" (${currentUser.role}) ausgewählt.`
          );
          return;
        }

        if (stepIndex > 0 && !targetDoc.workflow[stepIndex - 1].done && !targetStep.done) {
          alert(`Abhängigkeit beachten: Schritt ${stepIndex} (${getMember(targetDoc.workflow[stepIndex - 1].memberId).name}) muss zuerst abgeschlossen werden!`);
          return;
        }

        updateDataAndCloud(prev => {
          const docs = prev.documents.map(doc => {
            if (doc.id !== docId) return doc;
            const newWorkflow = [...doc.workflow];
            const currentStep = newWorkflow[stepIndex];

            const nowDone = !currentStep.done;
            newWorkflow[stepIndex] = {
              ...currentStep,
              done: nowDone,
              completedAt: nowDone ? `${new Date().toLocaleDateString("de-DE")} (durch ${currentUser.name})` : null
            };

            if (nowDone && stepIndex + 1 < newWorkflow.length) {
              const nextStep = newWorkflow[stepIndex + 1];
              const personA = getMember(currentStep.memberId);
              const personB = getMember(nextStep.memberId);
              setNotificationModal({
                title: "Vorarbeit erledigt! Nächste Person benachrichtigen?",
                recipient: personB,
                message: `Hallo ${personB.name}! 👋\n${personA.name} hat gerade den Schritt "${currentStep.title}" im Beitrag "${doc.title}" (NRM) fertiggestellt.\n\nDu kannst jetzt die aktuelle Datei herunterladen und mit deinem Teil starten: "${nextStep.title}".\nAbgabetermin ist der ${doc.deadline}.`
              });
            }

            return { ...doc, workflow: newWorkflow };
          });
          return { ...prev, documents: docs };
        });
      };

      // Beim Text-Tippen 600ms Debounce nutzen, damit nicht jeder einzelne Tastenanschlag einen Netzwerk-Request auslöst
      const updateDocContent = (content) => {
        updateDataAndCloud(prev => ({
          ...prev,
          documents: prev.documents.map(d => d.id === activeDoc.id ? { ...d, content } : d)
        }), 600);
      };

      const addWorkflowStep = (e) => {
        e.preventDefault();
        if (!newStepForm.title || !newStepForm.memberId) return;
        updateDataAndCloud(prev => ({
          ...prev,
          documents: prev.documents.map(d => {
            if (d.id !== activeDoc.id) return d;
            const nextStepNum = (d.workflow || []).length + 1;
            return {
              ...d,
              workflow: [...(d.workflow || []), {
                id: "w_" + Date.now(),
                step: nextStepNum,
                title: newStepForm.title,
                memberId: newStepForm.memberId,
                done: false,
                completedAt: null
              }]
            };
          })
        }));
        setNewStepForm({ title: "", memberId: "" });
      };

      const addResponsibility = (e) => {
        e.preventDefault();
        if (!newRespForm.task || !newRespForm.memberId) return;
        updateDataAndCloud(prev => ({
          ...prev,
          documents: prev.documents.map(d => {
            if (d.id !== activeDoc.id) return d;
            return {
              ...d,
              responsibilities: [...(d.responsibilities || []), { memberId: newRespForm.memberId, task: newRespForm.task }]
            };
          })
        }));
        setNewRespForm({ task: "", memberId: "" });
      };

      const addNote = (e) => {
        e.preventDefault();
        if (!newNoteText.trim()) return;
        updateDataAndCloud(prev => ({
          ...prev,
          documents: prev.documents.map(d => {
            if (d.id !== activeDoc.id) return d;
            return {
              ...d,
              notes: [{ id: "n_" + Date.now(), author: currentUser.name || "Redaktion", text: newNoteText, time: new Date().toLocaleString("de-DE") }, ...(d.notes || [])]
            };
          })
        }));
        setNewNoteText("");
      };

      const createNewDocument = (e) => {
        e.preventDefault();
        if (!newDocForm.title) return;
        const newDoc = {
          id: "d_" + Date.now(),
          title: newDocForm.title,
          category: newDocForm.category,
          deadline: newDocForm.deadline || "2026-12-01",
          description: newDocForm.description || "Gemeinsames Redaktionsdokument",
          responsibilities: [],
          workflow: [],
          files: [],
          content: `# ${newDocForm.title}\n\nHier gemeinsam schreiben oder rechts Dateien zur Weiterbearbeitung hochladen...`,
          notes: []
        };
        updateDataAndCloud(prev => ({ ...prev, documents: [...(prev.documents || []), newDoc] }));
        setSelectedDocId(newDoc.id);
        setNewDocModal(false);
        setNewDocForm({ title: "", category: "Allgemein", deadline: "", description: "" });
      };

      const exportData = () => {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `NRM-Projektstand-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
      };

      const importData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            imported.documents = (imported.documents || []).map(d => ({ ...d, files: d.files || [], notes: d.notes || [], responsibilities: d.responsibilities || [], workflow: d.workflow || [] }));
            updateDataAndCloud(imported);
            alert("NRM-Projektstand erfolgreich geladen und in die Cloud übertragen!");
          } catch (err) {
            alert("Ungültige Projekt-Datei.");
          }
        };
        reader.readAsText(file);
      };

      const renderCalendarGrid = () => {
        const year = calendarMonth.getFullYear();
        const month = calendarMonth.getMonth();
        const firstDayOfMonth = new Date(year, month, 1);
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const startOffset = (firstDayOfMonth.getDay() + 6) % 7;
        const allEvents = getAllCalendarEvents();

        const cells = [];
        for (let i = 0; i < startOffset; i++) {
          cells.push(<div key={`empty_${i}`} className="h-24 rounded-xl bg-slate-50/60 border border-slate-100"></div>);
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
          const dayEvents = allEvents.filter(ev => ev.date === dateStr);
          const isToday = new Date().toISOString().slice(0, 10) === dateStr;

          cells.push(
            <div
              key={dateStr}
              className={`h-24 p-1.5 rounded-xl border flex flex-col justify-between overflow-hidden transition ${
                isToday ? "bg-orange-50 border-orange-500 ring-1 ring-orange-400" : "bg-white border-orange-100 hover:border-orange-300"
              }`}
            >
              <div className="flex items-center justify-between">
                <span className={`text-xs font-bold w-6 h-6 rounded-full flex items-center justify-center ${isToday ? "bg-orange-600 text-white" : "text-slate-700"}`}>
                  {day}
                </span>
                {dayEvents.length > 0 && (
                  <button
                    onClick={() => downloadICSFile(dayEvents, `NRM-Termin-${dateStr}.ics`)}
                    title="Termine dieses Tages in PC-Kalender exportieren (.ics)"
                    className="text-[10px] text-orange-600 hover:text-orange-800 px-1"
                  >
                    <i className="fa-solid fa-calendar-plus"></i>
                  </button>
                )}
              </div>
              <div className="space-y-1 overflow-y-auto custom-scroll pr-0.5">
                {dayEvents.map(ev => (
                  <div
                    key={ev.id}
                    onClick={() => {
                      if (ev.isDocDeadline) {
                        setSelectedDocId(ev.docId);
                        setActiveTab("documents");
                      }
                    }}
                    title={`${ev.title} (${ev.time} Uhr) - ${ev.location}`}
                    className={`text-[10px] px-1.5 py-0.5 rounded font-semibold truncate cursor-pointer ${
                      ev.type === "Abgabe" || ev.isDocDeadline
                        ? "bg-red-100 text-red-800 border border-red-200"
                        : "bg-orange-100 text-orange-900 border border-orange-200"
                    }`}
                  >
                    {ev.time} {ev.rawTitle}
                  </div>
                ))}
              </div>
            </div>
          );
        }
        return cells;
      };

      const getRoleBadgeStyle = (role) => {
        if (role === "Teamleiter") return "bg-amber-100 text-amber-900 border border-amber-300";
        if (role === "MitarbeiterIn") return "bg-orange-100 text-orange-800";
        if (role === "Support") return "bg-blue-100 text-blue-800";
        return "bg-purple-100 text-purple-800";
      };

      const filteredDocs = selectedCategory === "Alle"
        ? (data.documents || [])
        : (data.documents || []).filter(d => d.category === selectedCategory);

      return (
        <div className="min-h-screen flex flex-col bg-orange-50/30">
          {/* WARN-BANNER FALLS FIREBASE SCHREIBRECHTE BLOCKIERT SIND */}
          {syncError && (
            <div className="bg-red-600 text-white px-4 py-2 text-xs font-semibold flex items-center justify-between gap-4">
              <div>
                <i className="fa-solid fa-triangle-exclamation mr-2"></i>
                {syncError}
              </div>
              <button
                onClick={() => pushToFirestore(data)}
                className="px-2.5 py-1 bg-white text-red-700 rounded-lg font-bold shrink-0"
              >
                Erneut versuchen
              </button>
            </div>
          )}

          {/* TOP NAVIGATION IN ORANGE */}
          <header className="bg-gradient-to-r from-orange-600 via-orange-500 to-amber-500 text-white shadow-md sticky top-0 z-30 border-b border-orange-700/20">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3.5">
                <div className="w-14 h-12 rounded-2xl bg-white/95 backdrop-blur px-1.5 py-1 flex items-center justify-center shadow-md border border-orange-200 shrink-0">
                  <img
                    src={logoSrc}
                    alt="Die 48er Logo"
                    className="max-h-full max-w-full object-contain drop-shadow-sm"
                  />
                </div>
                <div>
                  <h1 className="font-extrabold text-lg sm:text-xl leading-tight tracking-tight text-white drop-shadow-sm">
                    Nachrichten- und Redaktionsmedium (NRM)
                  </h1>
                  <p className="text-xs text-orange-100 font-medium flex items-center gap-2">
                    <span className={`inline-block w-2 h-2 rounded-full ${syncError ? "bg-red-300" : "bg-emerald-300 animate-pulse"}`}></span>
                    <span>{syncStatus}</span>
                    <button
                      onClick={() => pushToFirestore(data)}
                      title="Jetzt manuell in die Cloud pushen"
                      className="underline hover:text-white ml-1"
                    >
                      (Jetzt synchronisieren)
                    </button>
                  </p>
                </div>
              </div>

              <nav className="flex items-center gap-1 bg-orange-900/30 backdrop-blur-sm p-1 rounded-xl border border-white/15">
                <button
                  onClick={() => setActiveTab("documents")}
                  className={`px-3 py-1.5 rounded-lg text-sm font-semibold transition ${
                    activeTab === "documents"
                      ? "bg-white text-orange-700 shadow-sm"
                      : "text-orange-50 hover:bg-white/10"
                  }`}
                >
                  <i className="fa-solid fa-file-lines mr-1.5"></i>Dokumente & Dateien
                </button>
                <button
                  onClick={() => setActiveTab("calendar")}
                  className={`px-3 py-1.5 rounded-lg text-sm font-semibold transition ${
                    activeTab === "calendar"
                      ? "bg-white text-orange-700 shadow-sm"
                      : "text-orange-50 hover:bg-white/10"
                  }`}
                >
                  <i className="fa-solid fa-calendar-days mr-1.5"></i>Kalender & Abgaben
                </button>
                <button
                  onClick={() => setActiveTab("team")}
                  className={`px-3 py-1.5 rounded-lg text-sm font-semibold transition ${
                    activeTab === "team"
                      ? "bg-white text-orange-700 shadow-sm"
                      : "text-orange-50 hover:bg-white/10"
                  }`}
                >
                  <i className="fa-solid fa-users mr-1.5"></i>Team & Rollen
                </button>
              </nav>

              {/* AKTIVE PERSON & BACKUP */}
              <div className="flex flex-wrap items-center gap-2">
                <div className="flex items-center gap-1.5 bg-white/95 text-slate-800 px-2.5 py-1 rounded-xl shadow-sm border border-orange-200">
                  <i className={`fa-solid ${isCurrentUserLeader ? "fa-crown text-amber-500" : "fa-user-check text-orange-600"} text-xs`}></i>
                  <span className="text-[11px] font-bold text-slate-500">Ich bin:</span>
                  <select
                    value={currentUserId}
                    onChange={e => setCurrentUserId(e.target.value)}
                    className="text-xs font-bold text-slate-900 bg-transparent focus:outline-none cursor-pointer"
                    title="Wähle deinen Namen aus, um deine Arbeitsschritte (oder als Teamleiter alle Schritte) abzuhaken"
                  >
                    {(data.members || []).map(m => (
                      <option key={m.id} value={m.id}>
                        {m.name} ({m.role})
                      </option>
                    ))}
                  </select>
                </div>

                <button
                  onClick={exportData}
                  title="Kompletten Projektstand als Backup-Datei speichern"
                  className="px-2.5 py-1.5 bg-orange-950/40 hover:bg-orange-950/60 text-white text-xs font-medium rounded-lg border border-white/20 flex items-center gap-1 transition"
                >
                  <i className="fa-solid fa-download text-amber-200"></i> Backup
                </button>
                <label
                  title="Projektstand aus Backup-Datei laden"
                  className="px-2.5 py-1.5 bg-orange-950/40 hover:bg-orange-950/60 text-white text-xs font-medium rounded-lg border border-white/20 flex items-center gap-1 cursor-pointer transition"
                >
                  <i className="fa-solid fa-upload text-amber-200"></i> Laden
                  <input type="file" accept=".json" onChange={importData} className="hidden" />
                </label>
              </div>
            </div>
          </header>

          {/* MAIN CONTENT */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4">
            {/* TAB 1: DOKUMENTE, ÜBERSICHTSBLATT & DATEI-AUSTAUSCH */}
            {activeTab === "documents" && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                {/* LINKE SEITENLEISTE */}
                <div className="lg:col-span-3 space-y-4">
                  <div className="bg-white rounded-2xl p-4 shadow-sm border border-orange-200/70">
                    <div className="flex items-center justify-between mb-3">
                      <h2 className="font-bold text-sm uppercase tracking-wider text-orange-700">Kategorien</h2>
                      <button
                        onClick={() => setNewDocModal(true)}
                        className="bg-orange-600 hover:bg-orange-700 text-white text-xs px-2.5 py-1.5 rounded-lg font-semibold flex items-center gap-1 shadow-sm transition"
                      >
                        <i className="fa-solid fa-plus"></i> Neues Dok
                      </button>
                    </div>

                    <div className="flex flex-wrap gap-1.5 mb-4">
                      <button
                        onClick={() => setSelectedCategory("Alle")}
                        className={`px-2.5 py-1 rounded-lg text-xs font-semibold transition ${
                          selectedCategory === "Alle"
                            ? "bg-orange-600 text-white shadow-sm"
                            : "bg-orange-50 text-slate-700 hover:bg-orange-100"
                        }`}
                      >
                        Alle ({(data.documents || []).length})
                      </button>
                      {(data.categories || []).map(cat => (
                        <button
                          key={cat}
                          onClick={() => setSelectedCategory(cat)}
                          className={`px-2.5 py-1 rounded-lg text-xs font-semibold transition ${
                            selectedCategory === cat
                              ? "bg-orange-600 text-white shadow-sm"
                              : "bg-orange-50 text-slate-700 hover:bg-orange-100"
                          }`}
                        >
                          {cat}
                        </button>
                      ))}
                    </div>

                    <form
                      onSubmit={(e) => {
                        e.preventDefault();
                        if (newCategoryName && !(data.categories || []).includes(newCategoryName)) {
                          updateDataAndCloud(prev => ({ ...prev, categories: [...(prev.categories || []), newCategoryName] }));
                          setNewCategoryName("");
                        }
                      }}
                      className="flex gap-1 mb-4"
                    >
                      <input
                        type="text"
                        placeholder="Neue Kategorie..."
                        value={newCategoryName}
                        onChange={e => setNewCategoryName(e.target.value)}
                        className="w-full text-xs px-2.5 py-1.5 rounded-lg border border-orange-200 focus:outline-none focus:ring-2 focus:ring-orange-500"
                      />
                      <button type="submit" className="px-2.5 py-1.5 bg-orange-100 hover:bg-orange-200 text-orange-800 rounded-lg text-xs font-bold">+</button>
                    </form>

                    <h3 className="font-bold text-xs uppercase tracking-wider text-slate-400 mb-2">Beiträge & Dokumente</h3>
                    <div className="space-y-2">
                      {filteredDocs.map(doc => {
                        const prog = getProgress(doc);
                        const days = getDaysLeft(doc.deadline);
                        const isSelected = activeDoc && activeDoc.id === doc.id;
                        const fileCount = (doc.files || []).length;
                        return (
                          <div
                            key={doc.id}
                            onClick={() => setSelectedDocId(doc.id)}
                            className={`p-3 rounded-xl border cursor-pointer transition ${
                              isSelected
                                ? "bg-orange-50/90 border-orange-500 shadow-sm ring-1 ring-orange-500/30"
                                : "bg-white border-slate-200 hover:border-orange-300"
                            }`}
                          >
                            <div className="flex items-center justify-between gap-2 mb-1">
                              <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-orange-100 text-orange-800">
                                {doc.category}
                              </span>
                              <span className={`text-[11px] font-semibold ${days < 3 ? "text-red-600" : "text-slate-500"}`}>
                                <i className="fa-regular fa-clock mr-1"></i>
                                {doc.deadline}
                              </span>
                            </div>
                            <h4 className="font-bold text-sm text-slate-800 mb-2">{doc.title}</h4>
                            <div className="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
                              <div className="bg-orange-500 h-full transition-all" style={{ width: `${prog}%` }}></div>
                            </div>
                            <div className="flex justify-between items-center mt-1.5 text-[11px] text-slate-500">
                              <span>
                                <i className="fa-solid fa-paperclip mr-1 text-orange-600"></i>
                                {fileCount} {fileCount === 1 ? "Datei" : "Dateien"}
                              </span>
                              <span className="font-bold text-orange-700">{prog}%</span>
                            </div>
