                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>

                {/* RECHTER HAUPTBEREICH */}
                {activeDoc ? (
                  <div className="lg:col-span-9 space-y-6">
                    {/* DOKUMENT KOPFZEILE */}
                    <div className="bg-white rounded-2xl p-5 shadow-sm border border-orange-200/70 flex flex-wrap items-center justify-between gap-4">
                      <div>
                        <div className="flex items-center gap-2 mb-1 flex-wrap">
                          <span className="px-2.5 py-0.5 bg-orange-100 text-orange-800 rounded-full text-xs font-semibold">
                            {activeDoc.category}
                          </span>
                          <span className="text-xs text-slate-500">
                            <i className="fa-solid fa-calendar-day mr-1 text-orange-600"></i>
                            Abgabe: <strong>{activeDoc.deadline}</strong> ({getDaysLeft(activeDoc.deadline)} Tage übrig)
                          </span>
                          <button
                            onClick={() =>
                              downloadICSFile(
                                [{
                                  id: "doc_dl_" + activeDoc.id,
                                  title: `[NRM Abgabe] ${activeDoc.title}`,
                                  date: activeDoc.deadline,
                                  time: "18:00",
                                  location: activeDoc.category,
                                  description: activeDoc.description
                                }],
                                `Abgabe-${activeDoc.title.replace(/[^a-zA-Z0-9]/g, "_")}.ics`
                              )
                            }
                            title="Diesen Abgabetermin in deinen PC-/Smartphone-Kalender eintragen"
                            className="text-[11px] px-2 py-0.5 bg-orange-50 hover:bg-orange-100 text-orange-700 rounded-md border border-orange-200 font-medium"
                          >
                            <i className="fa-regular fa-calendar-plus mr-1"></i>In PC-Kalender
                          </button>
                        </div>
                        <h2 className="text-2xl font-bold text-slate-900">{activeDoc.title}</h2>
                        <p className="text-sm text-slate-600">{activeDoc.description}</p>
                      </div>

                      <div className="flex items-center gap-2">
                        <div className="flex items-center gap-1 bg-orange-50 p-1 rounded-xl border border-orange-200/60">
                          <button
                            onClick={() => setDocViewMode("sheet")}
                            className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                              docViewMode === "sheet" ? "bg-orange-600 shadow text-white" : "text-slate-600 hover:text-orange-700"
                            }`}
                          >
                            <i className="fa-solid fa-clipboard-list mr-1"></i> Steckbrief
                          </button>
                          <button
                            onClick={() => setDocViewMode("split")}
                            className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                              docViewMode === "split" ? "bg-orange-600 shadow text-white" : "text-slate-600 hover:text-orange-700"
                            }`}
                          >
                            <i className="fa-solid fa-columns mr-1"></i> Split
                          </button>
                          <button
                            onClick={() => setDocViewMode("editor")}
                            className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                              docViewMode === "editor" ? "bg-orange-600 shadow text-white" : "text-slate-600 hover:text-orange-700"
                            }`}
                          >
                            <i className="fa-solid fa-folder-open mr-1"></i> Dateien & Editor
                          </button>
                        </div>

                        <button
                          onClick={() => setEditingDocMeta({ ...activeDoc })}
                          title="Titel, Kategorie oder Abgabetermin bearbeiten"
                          className="p-2 bg-orange-50 hover:bg-orange-100 text-orange-700 rounded-xl text-xs border border-orange-200/60"
                        >
                          <i className="fa-solid fa-pen"></i>
                        </button>
                        <button
                          onClick={() => deleteDocument(activeDoc.id, activeDoc.title)}
                          title="Dieses Dokument löschen"
                          className="p-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-xs"
                        >
                          <i className="fa-solid fa-trash"></i>
                        </button>
                      </div>
                    </div>

                    <div className={`grid grid-cols-1 ${docViewMode === "split" ? "xl:grid-cols-2" : ""} gap-6`}>
                      {/* 1. ÜBERSICHTSBLATT (STECKBRIEF) */}
                      {(docViewMode === "sheet" || docViewMode === "split") && (
                        <div className="bg-white rounded-2xl p-5 shadow-sm border border-orange-200/70 space-y-6">
                          <div className="flex items-center justify-between border-b border-orange-100 pb-3">
                            <div>
                              <h3 className="font-bold text-lg text-slate-900 flex items-center gap-2">
                                <i className="fa-solid fa-id-card text-orange-600"></i>
                                Übersichtsblatt (Dokumenten-Steckbrief)
                              </h3>
                              <p className="text-xs text-slate-500">
                                Abhaken erlaubt für: <strong>Ausführende Person</strong> oder <strong>Teamleiter</strong>
                              </p>
                            </div>
                            <div className="text-right">
                              <span className="text-2xl font-extrabold text-orange-600">{getProgress(activeDoc)}%</span>
                              <span className="block text-[10px] uppercase tracking-wider text-slate-400">Gesamtfortschritt</span>
                            </div>
                          </div>

                          {/* ABHÄNGIGKEITS-KETTE */}
                          <div>
                            <div className="flex items-center justify-between mb-3">
                              <h4 className="font-bold text-xs uppercase tracking-wider text-slate-500">
                                <i className="fa-solid fa-diagram-next mr-1.5 text-orange-600"></i>
                                Abhängigkeiten & Reihenfolge (Person A ➔ Person B)
                              </h4>
                              <span className="text-[11px] px-2 py-0.5 rounded-full bg-orange-50 text-orange-800 border border-orange-200 font-medium">
                                Aktiv: <strong>{currentUser.name}</strong> ({currentUser.role})
                              </span>
                            </div>

                            <div className="space-y-3">
                              {(activeDoc.workflow || []).map((w, idx) => {
                                const member = getMember(w.memberId);
                                const prevDone = idx === 0 ? true : activeDoc.workflow[idx - 1].done;
                                const isBlocked = !prevDone && !w.done;
                                const isActive = prevDone && !w.done;
                                const hasPermission = canUserToggleStep(w);

                                return (
                                  <div
                                    key={w.id}
                                    className={`p-3.5 rounded-xl border transition relative ${
                                      w.done
                                        ? "bg-emerald-50/50 border-emerald-200"
                                        : isActive
                                        ? "bg-orange-50/80 border-orange-400 shadow-sm"
                                        : "bg-slate-50 border-slate-200 opacity-75"
                                    }`}
                                  >
                                    <div className="flex items-start justify-between gap-3">
                                      <div className="flex items-start gap-3">
                                        <button
                                          onClick={() => toggleWorkflowStep(activeDoc.id, idx)}
                                          title={
                                            !hasPermission
                                              ? `Gesperrt: Nur ${member.name} oder ein Teamleiter darf diesen Schritt abhaken`
                                              : isBlocked
                                              ? "Wartet noch auf Abschluss des vorherigen Schritts"
                                              : "Klicken zum Abhaken / Status ändern"
                                          }
                                          className={`mt-0.5 w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs transition shrink-0 ${
                                            w.done
                                              ? hasPermission
                                                ? "bg-emerald-600 text-white hover:bg-emerald-700"
                                                : "bg-emerald-600/70 text-white cursor-not-allowed"
                                              : !hasPermission || isBlocked
                                              ? "bg-slate-200 text-slate-400 cursor-not-allowed"
                                              : "bg-white border-2 border-orange-600 text-orange-600 hover:bg-orange-50"
                                          }`}
                                        >
                                          {w.done ? (
                                            <i className="fa-solid fa-check"></i>
                                          ) : !hasPermission ? (
                                            <i className="fa-solid fa-user-lock text-[10px]"></i>
                                          ) : (
                                            idx + 1
                                          )}
                                        </button>
                                        <div>
                                          <div className="flex items-center gap-2 flex-wrap">
                                            <span className={`font-semibold text-sm ${w.done ? "line-through text-slate-500" : "text-slate-900"}`}>
                                              {w.title}
                                            </span>
                                            {w.done && (
                                              <span className="text-[11px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-medium">
                                                Erledigt ({w.completedAt})
                                              </span>
                                            )}
                                            {isActive && (
                                              <span className="text-[11px] bg-orange-600 text-white px-2 py-0.5 rounded-full font-medium animate-pulse">
                                                Jetzt an der Reihe!
                                              </span>
                                            )}
                                            {isBlocked && (
                                              <span className="text-[11px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-medium">
                                                <i className="fa-solid fa-lock mr-1"></i>
                                                Wartet auf {getMember(activeDoc.workflow[idx - 1].memberId).name}
                                              </span>
                                            )}
                                          </div>

                                          <div className="flex items-center gap-2 mt-1.5 flex-wrap">
                                            <span className={`text-xs text-white px-2 py-0.5 rounded-md font-medium ${member.color}`}>
                                              {member.name}
                                            </span>
                                            <span className={`text-[11px] px-2 py-0.5 rounded-md font-semibold ${getRoleBadgeStyle(member.role)}`}>
                                              {member.role}
                                            </span>
                                            {!hasPermission && !w.done && (
                                              <span className="text-[11px] text-slate-400 italic">
                                                (Nur durch {member.name} oder Teamleiter abhakbar)
                                              </span>
                                            )}
                                          </div>
                                        </div>
                                      </div>

                                      <div className="flex items-center gap-1 shrink-0">
                                        <button
                                          onClick={() =>
                                            sendWhatsApp(
                                              member.phone,
                                              `Hallo ${member.name}! Kurze NRM-Erinnerung zum Beitrag "${activeDoc.title}": Dein Schritt "${w.title}" steht an (Abgabe: ${activeDoc.deadline}).`
                                            )
                                          }
                                          title={`WhatsApp an ${member.name} senden`}
                                          className="p-2 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white text-xs"
                                        >
                                          <i className="fa-brands fa-whatsapp"></i>
                                        </button>
                                        <button
                                          onClick={() =>
                                            sendSMS(
                                              member.phone,
                                              `Hallo ${member.name}! NRM-Erinnerung zum Beitrag "${activeDoc.title}": Schritt "${w.title}" (Abgabe: ${activeDoc.deadline}).`
                                            )
                                          }
                                          title={`SMS an ${member.name} senden`}
                                          className="p-2 rounded-lg bg-orange-500 hover:bg-orange-600 text-white text-xs"
                                        >
                                          <i className="fa-solid fa-comment-sms"></i>
                                        </button>
                                        <button
                                          onClick={() => setEditingStep({ ...w })}
                                          title="Arbeitsschritt bearbeiten"
                                          className="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs"
                                        >
                                          <i className="fa-solid fa-pen"></i>
                                        </button>
                                        <button
                                          onClick={() => deleteWorkflowStep(w.id)}
                                          title="Schritt löschen"
                                          className="p-2 rounded-lg bg-red-50 hover:bg-red-100 text-red-600 text-xs"
                                        >
                                          <i className="fa-solid fa-trash"></i>
                                        </button>
                                      </div>
                                    </div>
                                  </div>
                                );
                              })}
                            </div>

                            <form onSubmit={addWorkflowStep} className="mt-3 flex flex-wrap sm:flex-nowrap gap-2">
                              <input
                                type="text"
                                placeholder="Nächster abhängiger Arbeitsschritt..."
                                value={newStepForm.title}
                                onChange={e => setNewStepForm({ ...newStepForm, title: e.target.value })}
                                className="flex-1 text-xs px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-orange-500"
                              />
                              <select
                                value={newStepForm.memberId}
                                onChange={e => setNewStepForm({ ...newStepForm, memberId: e.target.value })}
                                className="text-xs px-3 py-2 rounded-xl border border-slate-200 bg-white"
                              >
                                <option value="">Person wählen...</option>
                                {(data.members || []).map(m => (
                                  <option key={m.id} value={m.id}>{m.name} ({m.role})</option>
                                ))}
                              </select>
                              <button type="submit" className="px-3 py-2 bg-orange-600 text-white text-xs font-semibold rounded-xl hover:bg-orange-700">
                                + Schritt
                              </button>
                            </form>
                          </div>

                          {/* ZUSTÄNDIGKEITEN */}
                          <div className="border-t border-orange-100 pt-4">
                            <h4 className="font-bold text-xs uppercase tracking-wider text-slate-500 mb-3">
                              <i className="fa-solid fa-user-check mr-1.5 text-orange-600"></i>
                              Involvierte Personen & Zuständigkeiten im Dokument
                            </h4>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                              {(activeDoc.responsibilities || []).map((r, i) => {
                                const m = getMember(r.memberId);
                                return (
                                  <div key={i} className="p-3 rounded-xl bg-orange-50/40 border border-orange-200/60 flex items-center justify-between gap-2">
                                    <div className="flex items-center gap-3 min-w-0">
                                      <div className={`w-8 h-8 rounded-full ${m.color} text-white flex items-center justify-center font-bold text-xs shrink-0`}>
                                        {m.name.slice(0, 2).toUpperCase()}
                                      </div>
                                      <div className="min-w-0">
                                        <p className="text-xs font-bold text-slate-800 truncate">
                                          {m.name} <span className="font-normal text-slate-500">({m.role})</span>
                                        </p>
                                        <p className="text-xs text-slate-600">{r.task}</p>
                                      </div>
                                    </div>
                                    <button
                                      onClick={() => deleteResponsibility(i)}
                                      title="Zuständigkeit entfernen"
                                      className="text-slate-400 hover:text-red-600 text-xs p-1"
                                    >
                                      <i className="fa-solid fa-xmark"></i>
                                    </button>
                                  </div>
                                );
                              })}
                            </div>

                            <form onSubmit={addResponsibility} className="mt-3 flex flex-wrap sm:flex-nowrap gap-2">
                              <input
                                type="text"
                                placeholder="Zuständigkeit (z.B. Kapitel 4, Korrektur)..."
                                value={newRespForm.task}
                                onChange={e => setNewRespForm({ ...newRespForm, task: e.target.value })}
                                className="flex-1 text-xs px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-orange-500"
                              />
                              <select
                                value={newRespForm.memberId}
                                onChange={e => setNewRespForm({ ...newRespForm, memberId: e.target.value })}
                                className="text-xs px-3 py-2 rounded-xl border border-slate-200 bg-white"
                              >
                                <option value="">Person wählen...</option>
                                {(data.members || []).map(m => (
                                  <option key={m.id} value={m.id}>{m.name}</option>
                                ))}
                              </select>
                              <button type="submit" className="px-3 py-2 bg-orange-100 hover:bg-orange-200 text-orange-900 text-xs font-semibold rounded-xl">
                                + Zuweisen
                              </button>
                            </form>
                          </div>
                        </div>
                      )}

                      {/* 2. DATEI-AUSTAUSCH & DOKUMENTEN-EDITOR */}
                      {(docViewMode === "editor" || docViewMode === "split") && (
                        <div className="space-y-6">
                          <div className="bg-white rounded-2xl p-5 shadow-sm border border-orange-200/70 space-y-4">
                            <div className="flex flex-wrap items-center justify-between gap-2 border-b border-orange-100 pb-3">
                              <div>
                                <h3 className="font-bold text-lg text-slate-900 flex items-center gap-2">
                                  <i className="fa-solid fa-cloud-arrow-up text-orange-600"></i>
                                  Dateien & Anhänge zum Weiterbearbeiten
                                </h3>
                                <p className="text-xs text-slate-500">
                                  Dateien bis 700 KB direkt hochladen oder für große Dateien Cloud-Link nutzen
                                </p>
                              </div>
                              <button
                                onClick={() => setShowLinkForm(!showLinkForm)}
                                className="text-xs px-2.5 py-1.5 bg-orange-50 hover:bg-orange-100 rounded-lg font-medium text-orange-800 border border-orange-200/60"
                              >
                                <i className="fa-solid fa-link mr-1"></i> Cloud-Link ergänzen
                              </button>
                            </div>

                            <div className="p-3.5 rounded-xl bg-orange-50/70 border border-orange-200 space-y-2.5">
                              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                <select
                                  value={uploadMemberId}
                                  onChange={e => setUploadMemberId(e.target.value)}
                                  className="text-xs px-3 py-2 rounded-lg border border-orange-200 bg-white"
                                >
                                  <option value="">Hochgeladen von ({currentUser.name})...</option>
                                  {(data.members || []).map(m => (
                                    <option key={m.id} value={m.id}>{m.name}</option>
                                  ))}
                                </select>
                                <input
                                  type="text"
                                  placeholder="Versions-Notiz (z.B. 'Kapitel 2 ergänzt')"
                                  value={uploadComment}
                                  onChange={e => setUploadComment(e.target.value)}
                                  className="text-xs px-3 py-2 rounded-lg border border-orange-200 bg-white"
                                />
                              </div>

                              <label className="w-full py-2.5 px-4 bg-orange-600 hover:bg-orange-700 text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-2 cursor-pointer transition shadow-sm">
                                <i className="fa-solid fa-file-arrow-up text-sm"></i>
                                Datei auswählen & zum Beitrag hochladen (Word, PDF, Excel, Bild...)
                                <input type="file" onChange={handleFileUpload} className="hidden" />
                              </label>
                            </div>

                            {showLinkForm && (
                              <form onSubmit={handleAddExternalLink} className="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                                <p className="text-xs font-bold text-slate-700">Externen Link (z.B. Google Drive, OneDrive, Dropbox) hinterlegen:</p>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                  <input
                                    type="text"
                                    required
                                    placeholder="Bezeichnung (z.B. Rohdaten / Video)"
                                    value={externalLinkForm.name}
                                    onChange={e => setExternalLinkForm({ ...externalLinkForm, name: e.target.value })}
                                    className="text-xs px-2.5 py-1.5 rounded-lg border border-slate-200"
                                  />
                                  <input
                                    type="url"
                                    required
                                    placeholder="https://..."
                                    value={externalLinkForm.url}
                                    onChange={e => setExternalLinkForm({ ...externalLinkForm, url: e.target.value })}
                                    className="text-xs px-2.5 py-1.5 rounded-lg border border-slate-200"
                                  />
                                  <button type="submit" className="bg-orange-600 hover:bg-orange-700 text-white text-xs font-semibold rounded-lg px-3 py-1.5">
                                    Link speichern
                                  </button>
                                </div>
                              </form>
                            )}

                            <div className="space-y-2 max-h-60 overflow-y-auto custom-scroll">
                              {(!activeDoc.files || activeDoc.files.length === 0) ? (
                                <p className="text-xs text-slate-400 text-center py-3">
                                  Noch keine Dateien zu diesem Beitrag hochgeladen.
                                </p>
                              ) : (
                                activeDoc.files.map(file => (
                                  <div key={file.id} className="p-3 rounded-xl bg-orange-50/30 border border-orange-200/70 flex items-center justify-between gap-3">
                                    <div className="flex items-center gap-3 min-w-0">
                                      <div className="w-9 h-9 rounded-lg bg-orange-100 text-orange-600 flex items-center justify-center shrink-0">
                                        <i className={`fa-solid ${file.isExternal ? "fa-up-right-from-square" : "fa-file-arrow-down"}`}></i>
                                      </div>
                                      <div className="min-w-0">
                                        <p className="text-xs font-bold text-slate-900 truncate">{file.name}</p>
                                        <p className="text-[11px] text-slate-500">
                                          Von <strong>{file.uploadedBy}</strong> · {file.uploadedAt}
                                          {file.size ? ` · ${formatFileSize(file.size)}` : ""}
                                        </p>
                                        {file.comment && (
                                          <p className="text-[11px] text-orange-700 font-medium mt-0.5">
                                            💬 „{file.comment}“
                                          </p>
                                        )}
                                      </div>
                                    </div>

                                    <div className="flex items-center gap-1.5 shrink-0">
                                      {file.isExternal ? (
                                        <a
                                          href={file.dataUrl}
                                          target="_blank"
                                          rel="noopener noreferrer"
                                          className="px-3 py-1.5 bg-orange-600 hover:bg-orange-700 text-white rounded-lg text-xs font-semibold flex items-center gap-1"
                                        >
                                          <i className="fa-solid fa-arrow-up-right-from-square"></i> Öffnen
                                        </a>
                                      ) : (
                                        <a
                                          href={file.dataUrl}
                                          download={file.name}
                                          className="px-3 py-1.5 bg-orange-600 hover:bg-orange-700 text-white rounded-lg text-xs font-semibold flex items-center gap-1"
                                        >
                                          <i className="fa-solid fa-download"></i> Herunterladen
                                        </a>
                                      )}
                                      <button
                                        onClick={() => deleteFile(file.id)}
                                        title="Datei löschen"
                                        className="p-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg text-xs"
                                      >
                                        <i className="fa-solid fa-trash"></i>
                                      </button>
                                    </div>
                                  </div>
                                ))
                              )}
                            </div>
                          </div>

                          {/* DIREKTER TEXT-EDITOR & NOTIZEN */}
                          <div className="bg-white rounded-2xl p-5 shadow-sm border border-orange-200/70 flex flex-col justify-between space-y-4">
                            <div>
                              <div className="flex items-center justify-between border-b border-orange-100 pb-3 mb-3">
                                <div>
                                  <h3 className="font-bold text-lg text-slate-900 flex items-center gap-2">
                                    <i className="fa-solid fa-file-pen text-orange-600"></i>
                                    Direkter Text-Entwurf & Redaktionsnotizen
                                  </h3>
                                  <p className="text-xs text-slate-500">Änderungen werden beim Tippen automatisch in der Cloud gespeichert</p>
                                </div>
                                <button
                                  onClick={() => {
                                    navigator.clipboard.writeText(activeDoc.content || "");
                                    alert("Text in die Zwischenablage kopiert!");
                                  }}
                                  className="text-xs px-3 py-1.5 bg-orange-50 hover:bg-orange-100 text-orange-800 rounded-lg font-medium border border-orange-200/60"
                                >
                                  <i className="fa-regular fa-copy mr-1"></i> Kopieren
                                </button>
                              </div>

                              <textarea
                                value={activeDoc.content || ""}
                                onChange={e => updateDocContent(e.target.value)}
                                rows={10}
                                className="w-full p-4 rounded-xl bg-orange-50/30 border border-orange-200/80 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                                placeholder="Hier gemeinsam am Artikel oder Dokument schreiben..."
                              />
                            </div>

                            <div className="border-t border-orange-100 pt-4">
                              <h4 className="font-bold text-xs uppercase tracking-wider text-slate-500 mb-2">
                                Übergabe-Kommentare zum Dokument
                              </h4>
                              <div className="space-y-2 max-h-36 overflow-y-auto mb-3">
                                {(activeDoc.notes || []).map(n => (
                                  <div key={n.id} className="p-2.5 rounded-xl bg-orange-50/40 border border-orange-200/60 text-xs">
                                    <div className="flex justify-between font-bold text-slate-700 mb-0.5">
                                      <span>{n.author}</span>
                                      <span className="text-slate-400 font-normal">{n.time}</span>
                                    </div>
                                    <p className="text-slate-600">{n.text}</p>
                                  </div>
                                ))}
                              </div>
                              <form onSubmit={addNote} className="flex gap-2">
                                <input
                                  type="text"
                                  placeholder={`Kommentar als ${currentUser.name} hinterlassen...`}
                                  value={newNoteText}
                                  onChange={e => setNewNoteText(e.target.value)}
                                  className="flex-1 text-xs px-3 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-orange-500"
                                />
                                <button type="submit" className="px-3 py-2 bg-orange-600 text-white text-xs font-semibold rounded-xl hover:bg-orange-700">
                                  Senden
                                </button>
                              </form>
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                ) : (
                  <div className="lg:col-span-9 bg-white rounded-2xl p-8 text-center">Bitte links ein Dokument auswählen oder neu anlegen.</div>
                )}
              </div>
            )}

            {/* TAB 2: INTERAKTIVER KALENDER, TREFFEN & PC-KALENDER-SYNCHRONISATION */}
            {activeTab === "calendar" && (
              <div className="space-y-6">
                <div className="bg-white rounded-2xl p-6 shadow-sm border border-orange-200/70">
                  <div className="flex flex-wrap items-center justify-between gap-4 mb-4 pb-3 border-b border-orange-100">
                    <div>
                      <h2 className="text-xl font-bold text-slate-900 flex items-center gap-2">
                        <i className="fa-solid fa-calendar-days text-orange-600"></i>
                        Redaktionskalender & PC-Synchronisation
                      </h2>
                      <p className="text-xs text-slate-500">
                        Enthält alle Gruppentreffen, Redaktionsschlüsse und Dokumenten-Abgabetermine
                      </p>
                    </div>

                    <div className="flex flex-wrap items-center gap-2">
                      <div className="flex items-center gap-1 bg-orange-50 p-1 rounded-xl border border-orange-200">
                        <button
                          onClick={() => setCalendarMonth(new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() - 1, 1))}
                          className="px-2.5 py-1 hover:bg-white rounded-lg text-xs font-bold text-orange-800"
                        >
                          <i className="fa-solid fa-chevron-left"></i>
                        </button>
                        <span className="px-3 text-xs font-bold text-slate-800 min-w-[130px] text-center">
                          {calendarMonth.toLocaleDateString("de-DE", { month: "long", year: "numeric" })}
                        </span>
                        <button
                          onClick={() => setCalendarMonth(new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + 1, 1))}
                          className="px-2.5 py-1 hover:bg-white rounded-lg text-xs font-bold text-orange-800"
                        >
                          <i className="fa-solid fa-chevron-right"></i>
                        </button>
                      </div>

                      <button
                        onClick={() => downloadICSFile(getAllCalendarEvents(), "NRM-Gesamtkalender.ics")}
                        className="px-3.5 py-2 bg-orange-600 hover:bg-orange-700 text-white rounded-xl text-xs font-semibold flex items-center gap-1.5 shadow-sm transition"
                      >
                        <i className="fa-solid fa-rotate"></i>
                        Alle Termine mit PC-Kalender synchronisieren (.ics)
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-7 gap-2 mb-2 text-center text-[11px] font-bold uppercase tracking-wider text-slate-400">
                    <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
                  </div>

                  <div className="grid grid-cols-7 gap-2">
                    {renderCalendarGrid()}
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div className="lg:col-span-2 bg-white rounded-2xl p-6 shadow-sm border border-orange-200/70">
                    <h3 className="text-lg font-bold mb-1">Terminliste: Sitzungen & Abgabetermine</h3>
                    <p className="text-xs text-slate-500 mb-4">
                      Jeder Termin kann einzeln in den PC-Kalender (Outlook, Apple, Windows, Google) übernommen oder per WhatsApp/SMS erinnert werden
                    </p>

                    <div className="space-y-3">
                      {(data.meetings || []).map(m => (
                        <div key={m.id} className="p-4 rounded-xl border border-orange-200/70 flex flex-wrap items-center justify-between gap-4 bg-orange-50/30">
                          <div className="flex items-center gap-3">
                            <div className={`w-12 h-12 rounded-xl flex flex-col items-center justify-center font-bold text-white shadow-sm ${m.type === "Abgabe" ? "bg-red-600" : "bg-orange-600"}`}>
                              <i className={`fa-solid ${m.type === "Abgabe" ? "fa-flag-checkered" : "fa-handshake"}`}></i>
                            </div>
                            <div>
                              <span className={`text-[10px] font-bold uppercase px-2 py-0.5 rounded-full ${m.type === "Abgabe" ? "bg-red-100 text-red-700" : "bg-orange-100 text-orange-800"}`}>
                                {m.type}
                              </span>
                              <h4 className="font-bold text-slate-900">{m.title}</h4>
                              <p className="text-xs text-slate-600">
                                <i className="fa-regular fa-calendar mr-1 text-orange-600"></i> {m.date} um {m.time} Uhr · <i className="fa-solid fa-location-dot ml-1 mr-1 text-orange-600"></i> {m.location}
                              </p>
                            </div>
                          </div>

                          <div className="flex items-center gap-1.5 flex-wrap">
                            <button
                              onClick={() =>
                                downloadICSFile(
                                  [{
                                    id: m.id,
                                    title: `[NRM ${m.type}] ${m.title}`,
                                    date: m.date,
                                    time: m.time,
                                    location: m.location,
                                    description: `Termin aus dem Nachrichten- und Redaktionsmedium (NRM)`
                                  }],
                                  `NRM-${m.title.replace(/[^a-zA-Z0-9]/g, "_")}.ics`
                                )
                              }
                              title="Diesen Termin in den PC-Kalender (Outlook / Windows / Apple) eintragen"
                              className="px-2.5 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-semibold flex items-center gap-1"
                            >
                              <i className="fa-regular fa-calendar-plus"></i> PC-Kalender
                            </button>
                            <button
                              onClick={() =>
                                sendWhatsApp(
                                  "",
                                  `📅 *NRM-Erinnerung (${m.type})*: "${m.title}"\n🕒 Wann: ${m.date} um ${m.time} Uhr\n📍 Wo: ${m.location}\nBitte pünktlich sein / rechtzeitig eintragen!`
                                )
                              }
                              className="px-3 py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl text-xs font-semibold flex items-center gap-1"
                            >
                              <i className="fa-brands fa-whatsapp text-sm"></i> WhatsApp
                            </button>
                            <button
                              onClick={() =>
                                sendSMS(
                                  (data.members || []).map(mem => mem.phone).join(","),
                                  `NRM-Erinnerung (${m.type}): "${m.title}" am ${m.date} um ${m.time} Uhr (${m.location}).`
                                )
                              }
                              className="px-3 py-2 bg-orange-600 hover:bg-orange-700 text-white rounded-xl text-xs font-semibold flex items-center gap-1"
                            >
                              <i className="fa-solid fa-comment-sms text-sm"></i> SMS
                            </button>
                            <button
                              onClick={() => setEditingMeeting({ ...m })}
                              title="Termin bearbeiten"
                              className="p-2 bg-orange-100 hover:bg-orange-200 text-orange-800 rounded-xl text-xs"
                            >
                              <i className="fa-solid fa-pen"></i>
                            </button>
                            <button
                              onClick={() => deleteMeeting(m.id)}
                              title="Termin löschen"
                              className="p-2 bg-red-100 hover:bg-red-200 text-red-600 rounded-xl text-xs"
                            >
                              <i className="fa-solid fa-trash"></i>
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="bg-white rounded-2xl p-6 shadow-sm border border-orange-200/70 h-fit">
                    <h3 className="font-bold text-lg mb-3">Neuen Termin eintragen</h3>
                    <form
                      onSubmit={e => {
                        e.preventDefault();
                        if (!newMeetingForm.title || !newMeetingForm.date) return;
                        const created = { ...newMeetingForm, id: "mt_" + Date.now() };
                        updateDataAndCloud(prev => ({
                          ...prev,
                          meetings: [...(prev.meetings || []), created]
                        }));
                        setNewMeetingForm({ title: "", date: "", time: "17:00", location: "", type: "Treffen" });
                      }}
                      className="space-y-3"
                    >
                      <div>
                        <label className="text-xs font-semibold text-slate-600">Art des Termins</label>
                        <select
                          value={newMeetingForm.type}
                          onChange={e => setNewMeetingForm({ ...newMeetingForm, type: e.target.value })}
                          className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white"
                        >
                          <option value="Treffen">Redaktionssitzung / Treffen</option>
                          <option value="Abgabe">Redaktionsschluss / Abgabe</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-xs font-semibold text-slate-600">Titel</label>
                        <input
                          type="text"
                          required
                          placeholder="z.B. Redaktionskonferenz"
                          value={newMeetingForm.title}
                          onChange={e => setNewMeetingForm({ ...newMeetingForm, title: e.target.value })}
                          className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                        />
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="text-xs font-semibold text-slate-600">Datum</label>
                          <input
                            type="date"
                            required
                            value={newMeetingForm.date}
                            onChange={e => setNewMeetingForm({ ...newMeetingForm, date: e.target.value })}
                            className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                          />
                        </div>
                        <div>
                          <label className="text-xs font-semibold text-slate-600">Uhrzeit</label>
                          <input
                            type="time"
                            value={newMeetingForm.time}
                            onChange={e => setNewMeetingForm({ ...newMeetingForm, time: e.target.value })}
                            className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                          />
                        </div>
                      </div>
                      <div>
                        <label className="text-xs font-semibold text-slate-600">Ort / Link</label>
                        <input
                          type="text"
                          placeholder="z.B. Zoom-Link oder Büro"
                          value={newMeetingForm.location}
                          onChange={e => setNewMeetingForm({ ...newMeetingForm, location: e.target.value })}
                          className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                        />
                      </div>
                      <button type="submit" className="w-full py-2.5 bg-orange-600 hover:bg-orange-700 text-white font-semibold rounded-xl text-sm shadow-sm transition">
                        Termin speichern
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: TEAMMITGLIEDER, ROLLEN-DROPDOWN & KONTAKTE */}
            {activeTab === "team" && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="lg:col-span-2 bg-white rounded-2xl p-6 shadow-sm border border-orange-200/70">
                  <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
                    <div>
                      <h2 className="text-xl font-bold">Redaktionsteam & Kontakte</h2>
                      <p className="text-xs text-slate-500">
                        Rollen steuern die Berechtigungen: <strong>Teamleiter</strong> sowie die jeweils zugewiesene Person dürfen Arbeitsschritte abhaken.
                      </p>
                    </div>
                    {(data.members || []).length > 0 && (
                      <button
                        onClick={() => {
                          if (confirm("Möchtest du wirklich ALLE Kontakte auf einmal löschen?")) {
                            updateDataAndCloud(prev => ({ ...prev, members: [] }));
                          }
                        }}
                        className="text-xs px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg font-medium"
                      >
                        <i className="fa-solid fa-trash-can mr-1"></i> Alle Kontakte leeren
                      </button>
                    )}
                  </div>

                  {(data.members || []).length === 0 ? (
                    <div className="p-8 text-center text-slate-500 text-sm border border-dashed rounded-xl">
                      Noch keine Teammitglieder eingetragen. Füge rechts deine Kolleginnen und Kollegen hinzu!
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      {(data.members || []).map(m => (
                        <div key={m.id} className="p-4 rounded-xl border border-orange-200/70 flex items-center justify-between bg-orange-50/30">
                          <div className="flex items-center gap-3 min-w-0">
                            <div className={`w-10 h-10 rounded-full ${m.color} text-white flex items-center justify-center font-bold shrink-0 shadow-sm`}>
                              {m.name.slice(0, 2).toUpperCase()}
                            </div>
                            <div className="min-w-0">
                              <div className="flex items-center gap-1.5 flex-wrap">
                                <h3 className="font-bold text-slate-900 text-sm truncate">{m.name}</h3>
                                {m.role === "Teamleiter" && (
                                  <i className="fa-solid fa-crown text-amber-500 text-xs" title="Teamleiter (darf alle Schritte freigeben)"></i>
                                )}
                              </div>
                              <span className={`inline-block text-[11px] px-2 py-0.5 rounded-md font-semibold mt-0.5 ${getRoleBadgeStyle(m.role)}`}>
                                {m.role}
                              </span>
                              <p className="text-xs font-mono text-slate-600 mt-1">{m.phone}</p>
                            </div>
                          </div>
                          <div className="flex gap-1 shrink-0">
                            <button
                              onClick={() => sendWhatsApp(m.phone, `Hallo ${m.name}! 👋`)}
                              title="WhatsApp senden"
                              className="p-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-lg text-xs"
                            >
                              <i className="fa-brands fa-whatsapp"></i>
                            </button>
                            <button
                              onClick={() => sendSMS(m.phone, `Hallo ${m.name}!`)}
                              title="SMS senden"
                              className="p-2 bg-orange-600 hover:bg-orange-700 text-white rounded-lg text-xs"
                            >
                              <i className="fa-solid fa-comment-sms"></i>
                            </button>
                            <button
                              onClick={() => openEditMemberModal(m)}
                              title={`${m.name} bearbeiten`}
                              className="p-2 bg-orange-100 hover:bg-orange-200 text-orange-800 rounded-lg text-xs"
                            >
                              <i className="fa-solid fa-pen"></i>
                            </button>
                            <button
                              onClick={() => deleteMember(m.id, m.name)}
                              title={`${m.name} löschen`}
                              className="p-2 bg-red-100 hover:bg-red-200 text-red-600 rounded-lg text-xs"
                            >
                              <i className="fa-solid fa-trash"></i>
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* PERSON HINZUFÜGEN MIT ROLLEN-DROPDOWN */}
                <div className="bg-white rounded-2xl p-6 shadow-sm border border-orange-200/70 h-fit">
                  <h3 className="font-bold text-lg mb-3">Person hinzufügen</h3>
                  <form
                    onSubmit={e => {
                      e.preventDefault();
                      if (!newMemberForm.name) return;
                      const finalRole = newMemberForm.roleType === "andere"
                        ? (newMemberForm.customRole.trim() || "Andere")
                        : newMemberForm.roleType;

                      const colors = ["bg-orange-600", "bg-amber-600", "bg-red-600", "bg-blue-600", "bg-emerald-600", "bg-purple-600"];
                      const newId = "m_" + Date.now();
                      updateDataAndCloud(prev => ({
                        ...prev,
                        members: [
                          ...(prev.members || []),
                          {
                            id: newId,
                            name: newMemberForm.name,
                            role: finalRole,
                            phone: newMemberForm.phone || "+43664...",
                            color: colors[(prev.members || []).length % colors.length]
                          }
                        ]
                      }));
                      setNewMemberForm({ name: "", roleType: "MitarbeiterIn", customRole: "", phone: "" });
                    }}
                    className="space-y-3"
                  >
                    <div>
                      <label className="text-xs font-semibold text-slate-600">Name</label>
                      <input
                        type="text"
                        required
                        placeholder="Name (z.B. Lisa M.)"
                        value={newMemberForm.name}
                        onChange={e => setNewMemberForm({ ...newMemberForm, name: e.target.value })}
                        className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                      />
                    </div>

                    <div>
                      <label className="text-xs font-semibold text-slate-600">Rolle auswählen</label>
                      <select
                        value={newMemberForm.roleType}
                        onChange={e => setNewMemberForm({ ...newMemberForm, roleType: e.target.value })}
                        className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white"
                      >
                        <option value="Teamleiter">Teamleiter</option>
                        <option value="MitarbeiterIn">MitarbeiterIn</option>
                        <option value="Support">Support</option>
                        <option value="andere">andere (frei eingeben...)</option>
                      </select>
                    </div>

                    {newMemberForm.roleType === "andere" && (
                      <div>
                        <label className="text-xs font-semibold text-orange-700">Eigene Rolle / Bezeichnung eingeben</label>
                        <input
                          type="text"
                          required
                          placeholder="Beliebige Rolle hinschreiben (z.B. Fotografie, Gastautor)..."
                          value={newMemberForm.customRole}
                          onChange={e => setNewMemberForm({ ...newMemberForm, customRole: e.target.value })}
                          className="w-full mt-1 px-3 py-2 rounded-xl border border-orange-300 bg-orange-50/40 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                        />
                      </div>
                    )}

                    <div>
                      <label className="text-xs font-semibold text-slate-600">Telefonnummer (für WhatsApp & SMS)</label>
                      <input
                        type="text"
                        placeholder="Telefonnummer (+43...)"
                        value={newMemberForm.phone}
                        onChange={e => setNewMemberForm({ ...newMemberForm, phone: e.target.value })}
                        className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                      />
                    </div>

                    <button type="submit" className="w-full py-2.5 bg-orange-600 hover:bg-orange-700 text-white font-semibold rounded-xl text-sm shadow-sm transition">
                      Mitglied speichern
                    </button>
                  </form>
                </div>
              </div>
            )}
          </main>

          {/* MODAL: GRUPPENMITGLIED BEARBEITEN */}
          {editingMember && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <form onSubmit={saveEditedMember} className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
                <h3 className="font-bold text-lg">Kontakt & Rolle bearbeiten</h3>
                <div>
                  <label className="text-xs font-semibold text-slate-600">Name</label>
                  <input
                    type="text"
                    required
                    value={editingMember.name}
                    onChange={e => setEditingMember({ ...editingMember, name: e.target.value })}
                    className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                  />
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-600">Rolle</label>
                  <select
                    value={editingMember.roleType}
                    onChange={e => setEditingMember({ ...editingMember, roleType: e.target.value })}
                    className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white"
                  >
                    <option value="Teamleiter">Teamleiter</option>
                    <option value="MitarbeiterIn">MitarbeiterIn</option>
                    <option value="Support">Support</option>
                    <option value="andere">andere (frei eingeben...)</option>
                  </select>
                </div>
                {editingMember.roleType === "andere" && (
                  <div>
                    <label className="text-xs font-semibold text-orange-700">Eigene Rolle / Bezeichnung</label>
                    <input
                      type="text"
                      required
                      placeholder="Rolle frei eingeben..."
                      value={editingMember.customRole}
                      onChange={e => setEditingMember({ ...editingMember, customRole: e.target.value })}
                      className="w-full mt-1 px-3 py-2 rounded-xl border border-orange-300 bg-orange-50/40 text-sm"
                    />
                  </div>
                )}
                <div>
                  <label className="text-xs font-semibold text-slate-600">Telefonnummer (für WhatsApp & SMS)</label>
                  <input
                    type="text"
                    value={editingMember.phone}
                    onChange={e => setEditingMember({ ...editingMember, phone: e.target.value })}
                    className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                  />
                </div>
                <div className="flex gap-2 justify-end pt-2">
                  <button type="button" onClick={() => setEditingMember(null)} className="px-4 py-2 text-xs text-slate-600">Abbrechen</button>
                  <button type="submit" className="px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white text-xs font-semibold rounded-xl">Änderungen speichern</button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL: DOKUMENT-STECKBRIEF BEARBEITEN */}
          {editingDocMeta && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <form onSubmit={saveEditedDocMeta} className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
                <h3 className="font-bold text-lg">Dokument-Steckbrief bearbeiten</h3>
                <div>
                  <label className="text-xs font-semibold text-slate-600">Titel</label>
                  <input
                    type="text"
                    required
                    value={editingDocMeta.title}
                    onChange={e => setEditingDocMeta({ ...editingDocMeta, title: e.target.value })}
                    className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                  />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-xs font-semibold text-slate-600">Kategorie</label>
                    <select
                      value={editingDocMeta.category}
                      onChange={e => setEditingDocMeta({ ...editingDocMeta, category: e.target.value })}
                      className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white"
                    >
                      {(data.categories || []).map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600">Abgabetermin</label>
                    <input
                      type="date"
                      value={editingDocMeta.deadline}
                      onChange={e => setEditingDocMeta({ ...editingDocMeta, deadline: e.target.value })}
                      className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                    />
                  </div>
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-600">Kurzbeschreibung</label>
                  <input
                    type="text"
                    value={editingDocMeta.description}
                    onChange={e => setEditingDocMeta({ ...editingDocMeta, description: e.target.value })}
                    className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                  />
                </div>
                <div className="flex gap-2 justify-end pt-2">
                  <button type="button" onClick={() => setEditingDocMeta(null)} className="px-4 py-2 text-xs text-slate-600">Abbrechen</button>
                  <button type="submit" className="px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white text-xs font-semibold rounded-xl">Speichern</button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL: ABHÄNGIGKEITS-SCHRITT BEARBEITEN */}
          {editingStep && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <form onSubmit={saveEditedStep} className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
                <h3 className="font-bold text-lg">Arbeitsschritt bearbeiten</h3>
                <div>
                  <label className="text-xs font-semibold text-slate-600">Beschreibung des Schritts</label>
                  <input
                    type="text"
                    required
                    value={editingStep.title}
                    onChange={e => setEditingStep({ ...editingStep, title: e.target.value })}
                    className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                  />
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-600">Zuständige Person</label>
                  <select
                    value={editingStep.memberId}
                    onChange={e => setEditingStep({ ...editingStep, memberId: e.target.value })}
                    className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white"
                  >
                    {(data.members || []).map(m => <option key={m.id} value={m.id}>{m.name} ({m.role})</option>)}
                  </select>
                </div>
                <div className="flex gap-2 justify-end pt-2">
                  <button type="button" onClick={() => setEditingStep(null)} className="px-4 py-2 text-xs text-slate-600">Abbrechen</button>
                  <button type="submit" className="px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white text-xs font-semibold rounded-xl">Speichern</button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL: TERMIN BEARBEITEN */}
          {editingMeeting && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <form onSubmit={saveEditedMeeting} className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
                <h3 className="font-bold text-lg">Termin bearbeiten</h3>
                <div>
                  <label className="text-xs font-semibold text-slate-600">Art</label>
                  <select
                    value={editingMeeting.type}
                    onChange={e => setEditingMeeting({ ...editingMeeting, type: e.target.value })}
                    className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white"
                  >
                    <option value="Treffen">Redaktionssitzung / Treffen</option>
                    <option value="Abgabe">Redaktionsschluss / Abgabe</option>
                  </select>
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-600">Titel</label>
                  <input
                    type="text"
                    required
                    value={editingMeeting.title}
                    onChange={e => setEditingMeeting({ ...editingMeeting, title: e.target.value })}
                    className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                  />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-xs font-semibold text-slate-600">Datum</label>
                    <input
                      type="date"
                      value={editingMeeting.date}
                      onChange={e => setEditingMeeting({ ...editingMeeting, date: e.target.value })}
                      className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                    />
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600">Uhrzeit</label>
                    <input
                      type="time"
                      value={editingMeeting.time}
                      onChange={e => setEditingMeeting({ ...editingMeeting, time: e.target.value })}
                      className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                    />
                  </div>
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-600">Ort / Link</label>
                  <input
                    type="text"
                    value={editingMeeting.location}
                    onChange={e => setEditingMeeting({ ...editingMeeting, location: e.target.value })}
                    className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                  />
                </div>
                <div className="flex gap-2 justify-end pt-2">
                  <button type="button" onClick={() => setEditingMeeting(null)} className="px-4 py-2 text-xs text-slate-600">Abbrechen</button>
                  <button type="submit" className="px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white text-xs font-semibold rounded-xl">Speichern</button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL: BENACHRICHTIGUNG BEI ABHÄNGIGKEIT */}
          {notificationModal && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
                <div className="flex items-center gap-3 text-orange-600">
                  <i className="fa-solid fa-bell text-2xl"></i>
                  <h3 className="font-bold text-lg text-slate-900">{notificationModal.title}</h3>
                </div>
                <p className="text-xs text-slate-600">
                  Da der Schritt erledigt wurde, ist jetzt <strong>{notificationModal.recipient.name}</strong> an der Reihe. Möchtest du direkt eine Benachrichtigung senden?
                </p>
                <div className="p-3 bg-orange-50/70 border border-orange-200 rounded-xl text-xs font-mono text-slate-700 whitespace-pre-wrap">
                  {notificationModal.message}
                </div>
                <div className="flex flex-wrap gap-2 pt-2">
                  <button
                    onClick={() => {
                      sendWhatsApp(notificationModal.recipient.phone, notificationModal.message);
                      setNotificationModal(null);
                    }}
                    className="flex-1 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-semibold rounded-xl text-xs flex items-center justify-center gap-1.5"
                  >
                    <i className="fa-brands fa-whatsapp text-base"></i> Per WhatsApp senden
                  </button>
                  <button
                    onClick={() => {
                      sendSMS(notificationModal.recipient.phone, notificationModal.message);
                      setNotificationModal(null);
                    }}
                    className="flex-1 py-2.5 bg-orange-600 hover:bg-orange-700 text-white font-semibold rounded-xl text-xs flex items-center justify-center gap-1.5"
                  >
                    <i className="fa-solid fa-comment-sms text-base"></i> Per SMS senden
                  </button>
                  <button
                    onClick={() => setNotificationModal(null)}
                    className="w-full py-2 text-xs text-slate-500 hover:text-slate-700"
                  >
                    Später erinnern
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: NEUES DOKUMENT */}
          {newDocModal && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <form onSubmit={createNewDocument} className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
                <h3 className="font-bold text-lg">Neues Dokument mit Übersichtsblatt</h3>
                <div>
                  <label className="text-xs font-semibold text-slate-600">Dokumenten-Titel</label>
                  <input
                    type="text"
                    required
                    placeholder="z.B. Redaktionsbeitrag & Interview"
                    value={newDocForm.title}
                    onChange={e => setNewDocForm({ ...newDocForm, title: e.target.value })}
                    className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                  />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-xs font-semibold text-slate-600">Kategorie</label>
                    <select
                      value={newDocForm.category}
                      onChange={e => setNewDocForm({ ...newDocForm, category: e.target.value })}
                      className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white"
                    >
                      {(data.categories || []).map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-slate-600">Abgabetermin</label>
                    <input
                      type="date"
                      value={newDocForm.deadline}
                      onChange={e => setNewDocForm({ ...newDocForm, deadline: e.target.value })}
                      className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                    />
                  </div>
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-600">Kurzbeschreibung</label>
                  <input
                    type="text"
                    placeholder="Worum geht es in diesem Beitrag?"
                    value={newDocForm.description}
                    onChange={e => setNewDocForm({ ...newDocForm, description: e.target.value })}
                    className="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 text-sm"
                  />
                </div>
                <div className="flex gap-2 justify-end pt-2">
                  <button type="button" onClick={() => setNewDocModal(false)} className="px-4 py-2 text-xs text-slate-600">Abbrechen</button>
                  <button type="submit" className="px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white text-xs font-semibold rounded-xl">Anlegen</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
